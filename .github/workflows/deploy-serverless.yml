name: Deploy Serverless Stack

# Manual dispatch only — prevents CI failures on every push when AWS
# credentials haven't been provisioned yet.
# Run from: GitHub → Actions → Deploy Serverless Stack → Run workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]
      skip_terraform:
        description: "Skip Terraform apply (image + frontend only)"
        required: false
        default: false
        type: boolean
      enable_cloudfront:
        description: "Enable CloudFront (requires AWS account verification)"
        required: false
        default: false
        type: boolean
      enable_custom_domain:
        description: "Provision Route 53 DNS zone and ACM certificates for custom domain"
        required: false
        default: false
        type: boolean
      custom_domain:
        description: "The apex domain to attach (e.g., 'sklbr.co')"
        required: false
        default: ""
        type: string

# Auth: static IAM keys stored in the GitHub "dev"/"prod" environment secrets.
# To upgrade to OIDC (keyless): create an OIDC provider + IAM role in AWS,
# add AWS_ROLE_ARN secret, swap the credentials step to use role-to-assume,
# and change id-token permission to write.
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: skillbridge
  TF_VERSION: "1.9.0"
  NODE_VERSION: "20"

jobs:
  deploy:
    name: Build & Deploy (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── AWS Auth ─────────────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Preflight checks ─────────────────────────────────────────────────────
      - name: Preflight checks
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        run: |
          P="${{ env.PROJECT_NAME }}"
          E="${{ env.ENVIRONMENT }}"
          echo "=== Preflight checks for $E environment ==="
          
          # Check VPC quota
          VPC_QUOTA=$(aws ec2 describe-account-attributes \
            --attribute-names vpc --query 'AccountAttributes[0].AttributeValues[0].AttributeValue' \
            --output text 2>/dev/null || echo "5")
          VPC_COUNT=$(aws ec2 describe-vpcs \
            --query 'Vpcs[].VpcId' --output text 2>/dev/null | wc -w | tr -d ' ')
          echo "  VPC quota: $VPC_QUOTA, current VPCs: $VPC_COUNT"
          if [ "$VPC_COUNT" -ge "$VPC_QUOTA" ]; then
            echo "  ERROR: VPC limit reached ($VPC_COUNT/$VPC_QUOTA). Please delete orphaned VPCs first."
            exit 1
          fi
          
          # Check if uploads bucket already exists (should be cleaned up first)
          UPLOADS_BUCKET="${P}-${E}-uploads"
          if aws s3api head-bucket --bucket "$UPLOADS_BUCKET" 2>/dev/null; then
            echo "  ERROR: Uploads bucket $UPLOADS_BUCKET already exists."
            echo "  Please run the workflow with skip_terraform=false first to clean up."
            exit 1
          fi
          
          echo "  Preflight checks passed"

      # Aurora master password forbids: '/', '@', '"', space
      # base64 output (from openssl rand -base64) may contain '/' — strip it.
      - name: Sanitize DB password for Aurora compatibility
        run: |
          SAFE=$(printf '%s' "$RAW" | tr -d '/@" ')
          if [ ${#SAFE} -lt 8 ]; then
            echo "ERROR: DB_PASSWORD is too short after sanitization (< 8 chars)."
            echo "Regenerate with: openssl rand -hex 24"
            exit 1
          fi
          echo "SAFE_DB_PASSWORD=${SAFE}" >> $GITHUB_ENV
        env:
          RAW: ${{ secrets.DB_PASSWORD }}

      # ── Compute CORS allowed origins ──────────────────────────────────────────
      # Allow localhost for dev + custom domain (if set). Written to $GITHUB_ENV
      # as TF_VAR_cors_allowed_origins so all downstream Terraform steps pick it
      # up automatically without needing to add it to every env: block.
      - name: Compute CORS allowed origins
        run: |
          DOMAIN="${{ github.event.inputs.custom_domain }}"
          if [ -n "$DOMAIN" ]; then
            CORS="[\"https://${DOMAIN}\",\"http://localhost:3000\",\"http://localhost:5173\"]"
          else
            CORS='["http://localhost:3000","http://localhost:5173"]'
          fi
          echo "TF_VAR_cors_allowed_origins=${CORS}" >> $GITHUB_ENV

      # ── Setup Terraform (early — needed for fmt/validate before ECR step) ────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── Terraform fmt check (catches formatting errors before any apply) ──────
      - name: Terraform fmt check
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      # ── Terraform state bucket (idempotent) ──────────────────────────────────
      # S3 backend keeps state across CI runs so resources aren't re-created.
      - name: Ensure Terraform state bucket exists
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="skillbridge-tfstate-${ACCOUNT}-${{ env.ENVIRONMENT }}"
          echo "STATE_BUCKET=${STATE_BUCKET}" >> $GITHUB_ENV

          # us-east-1 does NOT use --create-bucket-configuration
          aws s3api create-bucket \
            --bucket "$STATE_BUCKET" \
            --region "${{ env.AWS_REGION }}" 2>/dev/null || true

          # Versioning preserves state file history
          aws s3api put-bucket-versioning \
            --bucket "$STATE_BUCKET" \
            --versioning-configuration Status=Enabled 2>/dev/null || true

          # Block all public access on state bucket
          aws s3api put-public-access-block \
            --bucket "$STATE_BUCKET" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true \
            2>/dev/null || true

          # Enable SSE-S3 encryption
          aws s3api put-bucket-encryption \
            --bucket "$STATE_BUCKET" \
            --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}' \
            2>/dev/null || true

          echo "State bucket: $STATE_BUCKET"

      # ── Terraform Init ────────────────────────────────────────────────────────
      - name: Terraform Init
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        working-directory: ./terraform
        run: |
          terraform init \
            -upgrade \
            -input=false \
            -backend-config="bucket=${{ env.STATE_BUCKET }}" \
            -backend-config="key=${{ env.ENVIRONMENT }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      # skip_terraform path: init with existing state so we can read outputs
      - name: Terraform Init (skip_terraform path)
        if: ${{ github.event.inputs.skip_terraform == 'true' }}
        working-directory: ./terraform
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="skillbridge-tfstate-${ACCOUNT}-${{ env.ENVIRONMENT }}"
          echo "STATE_BUCKET=${STATE_BUCKET}" >> $GITHUB_ENV
          terraform init \
            -upgrade \
            -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${{ env.ENVIRONMENT }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      # ── Terraform validate (catches HCL errors before any AWS API calls) ──────
      - name: Terraform validate
        working-directory: ./terraform
        run: terraform validate

      # ── Step 1: Create ECR repository ────────────────────────────────────────
      # Import existing ECR if it was created in a previous run, then apply.
      # IMPORTANT: we do NOT import before this step — ECR may not exist yet on
      # the first run. The import + targeted apply is the single source of truth.
      - name: Create ECR repository
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        working-directory: ./terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_db_password: ${{ env.SAFE_DB_PASSWORD }}
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_refresh_token_secret: ${{ secrets.REFRESH_TOKEN_SECRET }}
          TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
          TF_VAR_enable_custom_domain: ${{ github.event.inputs.enable_custom_domain }}
          TF_VAR_custom_domain: ${{ github.event.inputs.custom_domain }}
          TF_VAR_internal_automation_token: ${{ secrets.INTERNAL_AUTOMATION_TOKEN }}
        run: |
          P="${{ env.PROJECT_NAME }}"
          E="${{ env.ENVIRONMENT }}"

          # Remove from state first so import is idempotent on re-runs
          terraform state rm module.ecr.aws_ecr_repository.backend 2>/dev/null || true
          terraform state rm module.ecr.aws_ecr_lifecycle_policy.backend 2>/dev/null || true

          # Import if the ECR repo already exists in AWS (re-run safety)
          terraform import -input=false \
            module.ecr.aws_ecr_repository.backend \
            "${P}-${E}-backend" \
            2>&1 | grep -v "^$" || true

          terraform import -input=false \
            module.ecr.aws_ecr_lifecycle_policy.backend \
            "${P}-${E}-backend" \
            2>&1 | grep -v "^$" || true

          terraform apply -target=module.ecr -auto-approve -input=false

      # ── Step 2: Build and push Lambda container image ─────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Cache Docker layers in the GitHub Actions cache to avoid re-downloading
      # PyTorch (~600 MB) and spaCy on every run. Cache key includes the
      # Dockerfile + requirements hash so it's invalidated on dependency changes.
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile.lambda', 'nestjs-backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push Lambda image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ECR="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-${ENVIRONMENT}-backend"

          docker buildx build \
            --platform linux/amd64 \
            -f Dockerfile.lambda \
            --provenance=false \
            --cache-from "type=local,src=/tmp/.buildx-cache" \
            --cache-to   "type=local,dest=/tmp/.buildx-cache-new,mode=max" \
            -t "${ECR}:${IMAGE_TAG}" \
            -t "${ECR}:latest" \
            --push \
            .

          # Rotate cache to prevent unbounded growth
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

          echo "IMAGE_URI=${ECR}:${IMAGE_TAG}" >> $GITHUB_ENV

      # ── Step 2b: Update Lambda functions when skipping Terraform ────────────────
      # When skip_terraform=true, Terraform doesn't run so Lambda still points to
      # the old image URI. Explicitly call update-function-code for all functions.
      - name: Update Lambda function code (skip_terraform path)
        if: ${{ github.event.inputs.skip_terraform == 'true' }}
        run: |
          set -euo pipefail
          P="${{ env.PROJECT_NAME }}"
          E="${{ env.ENVIRONMENT }}"
          for FN in api voice rag-query embed-gen gap-analysis resume-upload \
                    ssg-sync cache-cleanup recommendation-refresh \
                    embedding-backfill market-insights warmup; do
            FNAME="${P}-${E}-${FN}"
            if aws lambda get-function --function-name "$FNAME" &>/dev/null; then
              echo "Updating ${FNAME}..."
              aws lambda update-function-code \
                --function-name "$FNAME" \
                --image-uri "${{ env.IMAGE_URI }}" \
                --output text --query 'FunctionName'
            else
              echo "  ${FNAME} not found — skipping"
            fi
          done

      # ── Step 3: Clean up AWS resources for clean-slate Terraform apply ─────────
      # Strategy: remove all non-ECR modules from Terraform state, then delete
      # their corresponding AWS resources so Terraform rebuilds everything fresh.
      # ECR is preserved (contains the image we just pushed).
      - name: Clean up AWS resources for clean-slate Terraform apply
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        working-directory: ./terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_db_password: ${{ env.SAFE_DB_PASSWORD }}
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_refresh_token_secret: ${{ secrets.REFRESH_TOKEN_SECRET }}
          TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
          TF_VAR_enable_custom_domain: ${{ github.event.inputs.enable_custom_domain }}
          TF_VAR_custom_domain: ${{ github.event.inputs.custom_domain }}
          TF_VAR_internal_automation_token: ${{ secrets.INTERNAL_AUTOMATION_TOKEN }}
        run: |
          # Disable bash -e for this entire step.
          # This is a delete/cleanup script: every AWS CLI and terraform command
          # uses explicit "|| true" or structured if/else for error handling.
          # bash -e causes the step to abort immediately when any command
          # substitution (RESULT=$(aws ...)) returns non-zero, which always
          # happens on a first deploy when no resources exist yet (exit 254).
          set +e

          P="${{ env.PROJECT_NAME }}"
          E="${{ env.ENVIRONMENT }}"
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)

          echo "=== Step 0: Pre-cleanup - delete any orphaned VPCs (to avoid VPC limit) ==="
          # First, check VPC quota to avoid surprises
          VPC_QUOTA=$(aws ec2 describe-account-attributes \
            --attribute-names vpc --query 'AccountAttributes[0].AttributeValues[0].AttributeValue' \
            --output text 2>/dev/null || echo "5")
          VPC_COUNT=$(aws ec2 describe-vpcs \
            --query 'Vpcs[].VpcId' --output text 2>/dev/null | wc -w | tr -d ' ')
          echo "  VPC quota: $VPC_QUOTA, current VPCs: $VPC_COUNT"
          if [ "$VPC_COUNT" -ge "$VPC_QUOTA" ]; then
            echo "  WARNING: VPC limit reached ($VPC_COUNT/$VPC_QUOTA). Proceeding with cleanup..."
          fi
          
          # List all VPCs in the account and delete any that are not needed
          # This handles cases where previous deployments failed mid-cleanup
          for VPC_ID in $(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${P}-*-vpc" \
            --query 'Vpcs[].VpcId' --output text 2>/dev/null | tr '\t' '\n'); do
            [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ] && continue
            
            # Verify VPC has correct tags before deletion
            VPC_NAME=$(aws ec2 describe-vpcs --vpc-ids "$VPC_ID" \
              --query 'Vpcs[0].Tags[?Key==`Name`].Value[0]' --output text 2>/dev/null)
            
            # Only delete VPCs that match the pattern ${P}-*-vpc (not ${P}-${E}-vpc which is handled in Step 5)
            if [[ "$VPC_NAME" =~ ^${P}-.*-vpc$ ]] && [[ "$VPC_NAME" != "${P}-${E}-vpc" ]]; then
              echo "  Deleting orphaned VPC: $VPC_ID ($VPC_NAME)"

              # Get and delete any attached internet gateways
              for IGW in $(aws ec2 describe-internet-gateways \
                --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
                --query 'InternetGateways[].InternetGatewayId' \
                --output text 2>/dev/null | tr '\t' '\n'); do
                aws ec2 detach-internet-gateway \
                  --internet-gateway-id "$IGW" --vpc-id "$VPC_ID" 2>/dev/null || true
                aws ec2 delete-internet-gateway \
                  --internet-gateway-id "$IGW" 2>/dev/null || true
              done

              # Delete route tables (non-main)
              for RT in $(aws ec2 describe-route-tables \
                --filters "Name=vpc-id,Values=$VPC_ID" \
                --query 'RouteTables[?Associations[0].Main != `true`].RouteTableId' \
                --output text 2>/dev/null | tr '\t' '\n'); do
                aws ec2 delete-route-table --route-table-id "$RT" 2>/dev/null || true
              done

              # Delete subnets
              for SUBNET in $(aws ec2 describe-subnets \
                --filters "Name=vpc-id,Values=$VPC_ID" \
                --query 'Subnets[].SubnetId' \
                --output text 2>/dev/null | tr '\t' '\n'); do
                aws ec2 delete-subnet --subnet-id "$SUBNET" 2>/dev/null || true
              done

              # Delete security groups (non-default)
              for SG in $(aws ec2 describe-security-groups \
                --filters "Name=vpc-id,Values=$VPC_ID" \
                --query 'SecurityGroups[?GroupName != `default`].GroupId' \
                --output text 2>/dev/null | tr '\t' '\n'); do
                aws ec2 delete-security-group --group-id "$SG" 2>/dev/null || true
              done

              # Delete NAT gateways (and their EIPs)
              for NAT in $(aws ec2 describe-nat-gateways \
                --filter "Name=vpc-id,Values=$VPC_ID" \
                --query 'NatGateways[].NatGatewayId' \
                --output text 2>/dev/null | tr '\t' '\n'); do
                aws ec2 delete-nat-gateway --nat-gateway-id "$NAT" 2>/dev/null || true
              done

              # Delete VPC (must be empty at this point)
              aws ec2 delete-vpc --vpc-id "$VPC_ID" 2>/dev/null || true
              echo "  Deleted orphaned VPC: $VPC_ID"
            fi
          done
          echo "  Pre-cleanup VPC check complete"

          echo "=== Step 1: Remove non-ECR modules from Terraform state ==="
          # module.iam is intentionally kept in state so Terraform updates roles
          # in place rather than trying to create them (avoids 409 EntityAlreadyExists
          # when IAM roles survive the AWS cleanup due to attached managed policies).
          # module.eventbridge is removed — schedules are re-imported in Step 4c.
          for MOD in \
            module.vpc \
            module.security_groups \
            module.rds \
            module.lambda_backend \
            module.api_gateway \
            module.s3_frontend \
            module.eventbridge; do
            terraform state rm "$MOD" 2>&1 | head -3 || true
          done
          # Indexed (count-based) modules use bracket notation
          terraform state rm 'module.cloudfront[0]'  2>/dev/null || true
          terraform state rm 'module.opensearch[0]'  2>/dev/null || true
          terraform state rm 'module.websocket[0]'   2>/dev/null || true
          terraform state rm 'module.sagemaker[0]'   2>/dev/null || true
          # DNS module (Route 53 zone + ACM cert) — zone persists in AWS; re-imported below
          terraform state rm 'module.dns[0]'         2>/dev/null || true
          # CloudFront alias records (root-level resources in main.tf)
          terraform state rm 'aws_route53_record.cf_alias_root_a[0]'    2>/dev/null || true
          terraform state rm 'aws_route53_record.cf_alias_root_aaaa[0]' 2>/dev/null || true
          terraform state rm 'aws_route53_record.cf_alias_www_a[0]'     2>/dev/null || true
          terraform state rm 'aws_route53_record.cf_alias_www_aaaa[0]'  2>/dev/null || true
          # Uploads bucket + internal-token secret (root-level resources)
          terraform state rm 'aws_s3_bucket.uploads'                          2>/dev/null || true
          terraform state rm 'aws_s3_bucket_public_access_block.uploads'      2>/dev/null || true
          terraform state rm 'aws_s3_bucket_server_side_encryption_configuration.uploads' 2>/dev/null || true
          terraform state rm 'aws_secretsmanager_secret.internal_token'        2>/dev/null || true
          terraform state rm 'aws_secretsmanager_secret_version.internal_token' 2>/dev/null || true

          echo "=== Step 2: Kick off Aurora cluster deletion (async) ==="
          CLUSTER_ID="${P}-${E}-aurora"
          for INST in $(aws rds describe-db-clusters \
            --db-cluster-identifier "$CLUSTER_ID" \
            --query 'DBClusters[0].DBClusterMembers[].DBInstanceIdentifier' \
            --output text 2>/dev/null | tr '\t' '\n'); do
            echo "  Deleting Aurora instance: $INST"
            aws rds delete-db-instance \
              --db-instance-identifier "$INST" \
              --skip-final-snapshot 2>/dev/null || true
          done
          aws rds delete-db-cluster \
            --db-cluster-identifier "$CLUSTER_ID" \
            --skip-final-snapshot 2>/dev/null || true

          echo "=== Step 3: Delete Lambda functions, API Gateway, CWL log groups ==="
          for FN in api voice rag-query embed-gen gap-analysis resume-upload \
                    ssg-sync cache-cleanup recommendation-refresh \
                    embedding-backfill market-insights warmup; do
            aws lambda delete-function \
              --function-name "${P}-${E}-${FN}" 2>/dev/null || true
          done
          # Delete both the HTTP API and ALL WebSocket voice-ws APIs (avoid duplicates)
          for API_NAME in "${P}-${E}-api" "${P}-${E}-voice-ws"; do
            API_IDS=$(aws apigatewayv2 get-apis \
              --query "Items[?Name=='${API_NAME}'].ApiId" \
              --output text 2>/dev/null || echo "")
            for AID in $API_IDS; do
              [ -z "$AID" ] || [ "$AID" = "None" ] && continue
              echo "  Deleting API Gateway: ${API_NAME} (${AID})"
              aws apigatewayv2 delete-api --api-id "$AID" 2>/dev/null || true
            done
          done
          for LG in \
            "/aws/lambda/${P}-${E}-api" \
            "/aws/lambda/${P}-${E}-voice" \
            "/aws/lambda/${P}-${E}-rag-query" \
            "/aws/lambda/${P}-${E}-embed-gen" \
            "/aws/lambda/${P}-${E}-gap-analysis" \
            "/aws/lambda/${P}-${E}-resume-upload" \
            "/aws/lambda/${P}-${E}-ssg-sync" \
            "/aws/lambda/${P}-${E}-cache-cleanup" \
            "/aws/lambda/${P}-${E}-recommendation-refresh" \
            "/aws/lambda/${P}-${E}-embedding-backfill" \
            "/aws/lambda/${P}-${E}-market-insights" \
            "/aws/lambda/${P}-${E}-warmup" \
            "/aws/apigateway/${P}-${E}"; do
            aws logs delete-log-group --log-group-name "$LG" 2>/dev/null || true
          done

          # Step 4: IAM roles and policies are intentionally NOT deleted here.
          # module.iam is kept in Terraform state (see Step 1 comment) so Terraform
          # updates roles in place on re-deploy rather than attempting to create them.

          echo "=== Step 4: Delete Secrets Manager secret ==="
          aws secretsmanager delete-secret \
            --secret-id "${P}/internal-token" \
            --force-delete-without-recovery 2>/dev/null || true

          echo "=== Step 5: Delete ALL project-tagged VPCs and their dependencies ==="
          for VPC_ID in $(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${P}-${E}-vpc" \
            --query 'Vpcs[].VpcId' --output text 2>/dev/null | tr '\t' '\n'); do
            [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ] && continue
            echo "  Cleaning VPC: $VPC_ID"

            # ── FIX: Delete Lambda/RDS Elastic Network Interfaces first ──────────
            # Lambda functions in VPCs create ENIs that persist for up to 20 min
            # after the function is deleted. These block subnet deletion.
            # We must explicitly detach + delete them before touching subnets.
            echo "  Waiting for Lambda ENIs to become 'available' (up to 3 min)..."
            for i in $(seq 1 18); do
              IN_USE=$(aws ec2 describe-network-interfaces \
                --filters "Name=vpc-id,Values=$VPC_ID" "Name=status,Values=in-use" \
                --query 'NetworkInterfaces[?Description!=`null`] | length(@)' \
                --output text 2>/dev/null || echo "0")
              [ "$IN_USE" = "0" ] && break
              echo "    $IN_USE ENIs still in-use ($i/18)..."
              sleep 10
            done
            for ENI in $(aws ec2 describe-network-interfaces \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=status,Values=available" \
              --query 'NetworkInterfaces[].NetworkInterfaceId' \
              --output text 2>/dev/null | tr '\t' '\n'); do
              [ -z "$ENI" ] && continue
              echo "    Deleting ENI: $ENI"
              aws ec2 delete-network-interface \
                --network-interface-id "$ENI" 2>/dev/null || true
            done

            # Security Groups (non-default)
            for SG in $(aws ec2 describe-security-groups \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'SecurityGroups[?GroupName != `default`].GroupId' \
              --output text 2>/dev/null | tr '\t' '\n'); do
              aws ec2 delete-security-group --group-id "$SG" 2>/dev/null || true
            done

            # NAT Gateways (async delete)
            for NAT in $(aws ec2 describe-nat-gateways \
              --filter "Name=vpc-id,Values=$VPC_ID" \
                       "Name=state,Values=available,pending" \
              --query 'NatGateways[].NatGatewayId' \
              --output text 2>/dev/null | tr '\t' '\n'); do
              aws ec2 delete-nat-gateway --nat-gateway-id "$NAT" 2>/dev/null || true
            done
            # Wait for NAT GW deletion (up to 3 min)
            for i in $(seq 1 18); do
              PENDING=$(aws ec2 describe-nat-gateways \
                --filter "Name=vpc-id,Values=$VPC_ID" \
                         "Name=state,Values=available,pending,deleting" \
                --query 'NatGateways[].NatGatewayId' --output text 2>/dev/null)
              [ -z "$PENDING" ] && break
              echo "  Waiting for NAT GW... ($i/18)"
              sleep 10
            done

            # Internet Gateway
            for IGW in $(aws ec2 describe-internet-gateways \
              --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
              --query 'InternetGateways[].InternetGatewayId' \
              --output text 2>/dev/null | tr '\t' '\n'); do
              aws ec2 detach-internet-gateway \
                --internet-gateway-id "$IGW" --vpc-id "$VPC_ID" 2>/dev/null || true
              aws ec2 delete-internet-gateway \
                --internet-gateway-id "$IGW" 2>/dev/null || true
            done

            # Route tables (non-main)
            for RT in $(aws ec2 describe-route-tables \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'RouteTables[?Associations[0].Main != `true`].RouteTableId' \
              --output text 2>/dev/null | tr '\t' '\n'); do
              aws ec2 delete-route-table --route-table-id "$RT" 2>/dev/null || true
            done

            # Subnets (after ENIs and NAT GW are gone)
            for SUBNET in $(aws ec2 describe-subnets \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'Subnets[].SubnetId' \
              --output text 2>/dev/null | tr '\t' '\n'); do
              aws ec2 delete-subnet --subnet-id "$SUBNET" 2>/dev/null || true
            done

            aws ec2 delete-vpc --vpc-id "$VPC_ID" 2>/dev/null || true
            echo "  Deleted VPC: $VPC_ID"
          done

          echo "=== Step 6: Release unassociated project EIPs ==="
          for EIP in $(aws ec2 describe-addresses \
            --filters "Name=tag:Name,Values=${P}-${E}-nat-eip" \
            --query 'Addresses[].AllocationId' \
            --output text 2>/dev/null | tr '\t' '\n'); do
            [ -n "$EIP" ] && aws ec2 release-address \
              --allocation-id "$EIP" 2>/dev/null || true
          done

          echo "=== Step 7: Wait for Aurora cluster deletion (up to 15 min) ==="
          for i in $(seq 1 90); do
            STATUS=$(aws rds describe-db-clusters \
              --db-cluster-identifier "$CLUSTER_ID" \
              --query 'DBClusters[0].Status' \
              --output text 2>/dev/null || echo "gone")
            if [ "$STATUS" = "gone" ] || [ "$STATUS" = "None" ] || [ -z "$STATUS" ]; then
              echo "  Aurora is gone — proceeding"
              break
            fi
            echo "  Aurora status: $STATUS ($i/90)"
            sleep 10
          done

          echo "=== Step 8: Delete RDS subnet group + parameter group (with retries) ==="
          for i in $(seq 1 60); do
            RESULT=$(aws rds delete-db-subnet-group \
              --db-subnet-group-name "${P}-${E}-db-subnet" 2>&1)
            if [ $? -eq 0 ] || echo "$RESULT" | grep -qi "DBSubnetGroupNotFoundFault\|Cannot find"; then
              echo "  Subnet group deleted (or already gone)"
              break
            fi
            echo "  Waiting for subnet group ($i/60): $RESULT"
            sleep 10
          done
          for i in $(seq 1 12); do
            RESULT=$(aws rds delete-db-cluster-parameter-group \
              --db-cluster-parameter-group-name "${P}-${E}-aurora-pg16" 2>&1)
            if [ $? -eq 0 ] || echo "$RESULT" | grep -qi "DBParameterGroupNotFoundFault\|Cannot find"; then
              echo "  Cluster parameter group deleted (or already gone)"
              break
            fi
            echo "  Waiting for parameter group ($i/12): $RESULT"
            sleep 10
          done
          aws rds delete-db-parameter-group \
            --db-parameter-group-name "${P}-${E}-pg16" 2>/dev/null || true

          echo "=== Step 9: Delete Secrets Manager secret ==="
          aws secretsmanager delete-secret \
            --secret-id "${P}/${E}/db-credentials" \
            --force-delete-without-recovery 2>/dev/null || true

          echo "=== Step 10: Empty + delete uploads S3 bucket (if it exists) ==="
          UPLOADS_BUCKET="${P}-${E}-uploads"
          # Safety check: only proceed if bucket exists AND has correct tags
          # This prevents accidentally deleting buckets from other sources
          if aws s3api head-bucket --bucket "$UPLOADS_BUCKET" 2>/dev/null; then
            echo "  Bucket $UPLOADS_BUCKET exists, verifying tags..."
            # Verify bucket has the expected tag: Name=${P}-${E}-uploads
            BUCKET_TAGS=$(aws s3api get-bucket-tagging --bucket "$UPLOADS_BUCKET" 2>/dev/null)
            EXPECTED_TAG="\"Key\":\"Name\",\"Value\":\"${P}-${E}-uploads\""
            if echo "$BUCKET_TAGS" | grep -q "$EXPECTED_TAG"; then
              echo "  Bucket tags verified, proceeding with deletion..."
              # Remove bucket policy if it exists (can block deletion)
              aws s3api delete-bucket-policy --bucket "$UPLOADS_BUCKET" 2>/dev/null || true
              # Remove any encryption configuration
              aws s3api delete-bucket-encryption --bucket "$UPLOADS_BUCKET" 2>/dev/null || true
              # Remove public access block
              aws s3api delete-public-access-block --bucket "$UPLOADS_BUCKET" 2>/dev/null || true
              # Empty the bucket (including all versions if versioning was enabled)
              aws s3 rm "s3://${UPLOADS_BUCKET}" --recursive --include "*" 2>/dev/null || true
              # Delete the bucket
              aws s3api delete-bucket --bucket "$UPLOADS_BUCKET" \
                --region "${{ env.AWS_REGION }}" 2>/dev/null || true
              echo "  Bucket $UPLOADS_BUCKET deleted"
            else
              echo "  WARNING: Bucket $UPLOADS_BUCKET exists but has unexpected tags. Skipping deletion."
              echo "  This may indicate a bucket from another source. Manual intervention required."
            fi
          else
            echo "  Bucket $UPLOADS_BUCKET does not exist"
          fi

          echo "=== Step 11: Clear CNAME aliases from any existing CloudFront distributions ==="
          # CloudFront distributions with CNAME aliases (e.g. sklbr.co) must have those
          # aliases removed before Terraform can create a new distribution with the same CNAMEs.
          # Updating aliases on an enabled distribution is instant and does not require disabling.
          # Search by actual alias value (not by Comment) so we find distributions regardless
          # of how they were originally created or what comment they were given.
          CF_DOMAIN="${{ github.event.inputs.custom_domain }}"
          if [ -n "$CF_DOMAIN" ]; then
            ALL_DISTS=$(aws cloudfront list-distributions --output json 2>/dev/null || echo '{"DistributionList":{"Items":[]}}')
            for DIST_ID in $(echo "$ALL_DISTS" | jq -r --arg d "$CF_DOMAIN" \
              '.DistributionList.Items[]? | select(any(.Aliases.Items[]?; . == $d)) | .Id' 2>/dev/null); do
              [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ] && continue
              echo "  Clearing CNAME aliases from CloudFront distribution: $DIST_ID"
              ETAG=$(aws cloudfront get-distribution-config --id "$DIST_ID" \
                --query 'ETag' --output text 2>/dev/null)
              CONFIG=$(aws cloudfront get-distribution-config --id "$DIST_ID" \
                --query 'DistributionConfig' --output json 2>/dev/null)
              if [ -n "$ETAG" ] && [ "$ETAG" != "None" ]; then
                UPDATED=$(echo "$CONFIG" | jq '.Aliases = {"Quantity": 0, "Items": []}')
                aws cloudfront update-distribution \
                  --id "$DIST_ID" \
                  --distribution-config "$UPDATED" \
                  --if-match "$ETAG" \
                  --output text --query 'Distribution.Id' 2>/dev/null || true
                echo "  Aliases cleared from $DIST_ID"
              fi
            done
          fi

          echo "Cleanup complete — Terraform will rebuild all resources from scratch"
          exit 0

      # ── Step 4: Re-import ECR (only resource we kept across the cleanup) ───────
      - name: Import ECR into Terraform state
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        working-directory: ./terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_db_password: ${{ env.SAFE_DB_PASSWORD }}
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_refresh_token_secret: ${{ secrets.REFRESH_TOKEN_SECRET }}
          TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
          TF_VAR_enable_custom_domain: ${{ github.event.inputs.enable_custom_domain }}
          TF_VAR_custom_domain: ${{ github.event.inputs.custom_domain }}
          TF_VAR_internal_automation_token: ${{ secrets.INTERNAL_AUTOMATION_TOKEN }}
        run: |
          P="${{ env.PROJECT_NAME }}"
          E="${{ env.ENVIRONMENT }}"

          # Remove from state first in case the earlier targeted apply left it there
          terraform state rm module.ecr.aws_ecr_repository.backend 2>/dev/null || true
          terraform state rm module.ecr.aws_ecr_lifecycle_policy.backend 2>/dev/null || true

          terraform import -input=false \
            module.ecr.aws_ecr_repository.backend \
            "${P}-${E}-backend" \
            2>&1 | grep -v "^$" || true

          terraform import -input=false \
            module.ecr.aws_ecr_lifecycle_policy.backend \
            "${P}-${E}-backend" \
            2>&1 | grep -v "^$" || true

          echo "ECR import complete"

      # ── Step 4b: Import IAM into Terraform state (safety net) ───────────────
      # If module.iam was removed from state in a previous run (state corruption),
      # the IAM roles/policies still exist in AWS and Terraform would fail with
      # 409 EntityAlreadyExists. Import them so Terraform updates in place.
      # All imports use || true so the step is idempotent on fresh deploys where
      # the resources don't exist yet (import fails, Terraform creates them).
      - name: Import IAM into Terraform state
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        working-directory: ./terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_db_password: ${{ env.SAFE_DB_PASSWORD }}
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_refresh_token_secret: ${{ secrets.REFRESH_TOKEN_SECRET }}
          TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
          TF_VAR_enable_custom_domain: ${{ github.event.inputs.enable_custom_domain }}
          TF_VAR_custom_domain: ${{ github.event.inputs.custom_domain }}
          TF_VAR_internal_automation_token: ${{ secrets.INTERNAL_AUTOMATION_TOKEN }}
        run: |
          P="${{ env.PROJECT_NAME }}"
          E="${{ env.ENVIRONMENT }}"
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)

          # Helper: remove from state then import (idempotent — safe to re-run)
          import_iam_role() {
            local addr="$1" name="$2"
            terraform state rm "$addr" 2>/dev/null || true
            terraform import -input=false "$addr" "$name" 2>&1 | grep -v "^$" || true
          }
          import_iam_policy() {
            local addr="$1" arn="$2"
            terraform state rm "$addr" 2>/dev/null || true
            terraform import -input=false "$addr" "$arn" 2>&1 | grep -v "^$" || true
          }
          import_iam_attachment() {
            local addr="$1" id="$2"
            terraform state rm "$addr" 2>/dev/null || true
            terraform import -input=false "$addr" "$id" 2>&1 | grep -v "^$" || true
          }

          # ── Lambda exec role (main backend) ───────────────────────────────────
          import_iam_role   "module.iam.aws_iam_role.lambda_exec"              "${P}-${E}-lambda-exec"
          import_iam_policy "module.iam.aws_iam_policy.skillbridge_lambda"     "arn:aws:iam::${ACCOUNT}:policy/${P}-${E}-lambda-policy"
          import_iam_attachment "module.iam.aws_iam_role_policy_attachment.lambda_basic_execution" \
            "${P}-${E}-lambda-exec/arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
          import_iam_attachment "module.iam.aws_iam_role_policy_attachment.lambda_vpc_access" \
            "${P}-${E}-lambda-exec/arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
          import_iam_attachment "module.iam.aws_iam_role_policy_attachment.skillbridge_lambda" \
            "${P}-${E}-lambda-exec/arn:aws:iam::${ACCOUNT}:policy/${P}-${E}-lambda-policy"

          # ── EventBridge automation Lambda role ────────────────────────────────
          import_iam_role   "module.iam.aws_iam_role.automation_lambda"              "${P}-${E}-automation-lambda"
          import_iam_policy "module.iam.aws_iam_policy.automation_lambda"            "arn:aws:iam::${ACCOUNT}:policy/${P}-${E}-automation-lambda-policy"
          import_iam_attachment "module.iam.aws_iam_role_policy_attachment.automation_lambda_basic" \
            "${P}-${E}-automation-lambda/arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
          import_iam_attachment "module.iam.aws_iam_role_policy_attachment.automation_lambda" \
            "${P}-${E}-automation-lambda/arn:aws:iam::${ACCOUNT}:policy/${P}-${E}-automation-lambda-policy"

          # ── EventBridge Scheduler role ─────────────────────────────────────────
          import_iam_role   "module.iam.aws_iam_role.eventbridge_scheduler"              "${P}-${E}-eventbridge-scheduler"
          import_iam_policy "module.iam.aws_iam_policy.eventbridge_scheduler"            "arn:aws:iam::${ACCOUNT}:policy/${P}-${E}-eventbridge-scheduler-policy"
          import_iam_attachment "module.iam.aws_iam_role_policy_attachment.eventbridge_scheduler" \
            "${P}-${E}-eventbridge-scheduler/arn:aws:iam::${ACCOUNT}:policy/${P}-${E}-eventbridge-scheduler-policy"

          echo "IAM import complete"

      # ── Step 4c: Import EventBridge Schedules into Terraform state ────────────
      # EventBridge Scheduler Schedules are NOT deleted in the cleanup step
      # (module.eventbridge is removed from state but the AWS schedules persist).
      # Import them so Terraform updates in place rather than failing with
      # ConflictException: Schedule already exists.
      # Import format: default/<schedule-name>
      - name: Import EventBridge Schedules into Terraform state
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        working-directory: ./terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_db_password: ${{ env.SAFE_DB_PASSWORD }}
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_refresh_token_secret: ${{ secrets.REFRESH_TOKEN_SECRET }}
          TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
          TF_VAR_enable_custom_domain: ${{ github.event.inputs.enable_custom_domain }}
          TF_VAR_custom_domain: ${{ github.event.inputs.custom_domain }}
          TF_VAR_internal_automation_token: ${{ secrets.INTERNAL_AUTOMATION_TOKEN }}
        run: |
          P="${{ env.PROJECT_NAME }}"
          E="${{ env.ENVIRONMENT }}"

          import_schedule() {
            local addr="$1" name="$2"
            terraform state rm "$addr" 2>/dev/null || true
            terraform import -input=false "$addr" "default/${name}" 2>&1 | grep -v "^$" || true
          }

          import_schedule "module.eventbridge.aws_scheduler_schedule.ssg_course_sync"              "${P}-${E}-ssg-course-sync"
          import_schedule "module.eventbridge.aws_scheduler_schedule.ssg_jobrole_sync"             "${P}-${E}-ssg-jobrole-sync"
          import_schedule "module.eventbridge.aws_scheduler_schedule.recommendation_precompute"    "${P}-${E}-recommendation-precompute"
          import_schedule "module.eventbridge.aws_scheduler_schedule.recommendation_rationale_pregen" "${P}-${E}-rationale-pregen"
          import_schedule "module.eventbridge.aws_scheduler_schedule.cache_cleanup"               "${P}-${E}-cleanup-expired-cache"
          import_schedule "module.eventbridge.aws_scheduler_schedule.market_insights"             "${P}-${E}-market-insights-aggregation"
          import_schedule "module.eventbridge.aws_scheduler_schedule.embedding_backfill"          "${P}-${E}-embedding-backfill"
          # lambda_warmup is count-based (count = var.enable_warmup ? 1 : 0)
          import_schedule "module.eventbridge.aws_scheduler_schedule.lambda_warmup[0]"            "${P}-${E}-lambda-warmup-ping"

          echo "EventBridge schedule import complete"

      # ── Step 4c.5: Import CloudWatch Query Definitions ────────────────────────
      # CW Query Definitions persist across clean-slate deploys (not deleted by
      # the cleanup step). Import them so Terraform updates in place rather than
      # failing with InvalidParameterException: A query with this name already exists.
      - name: Import CloudWatch Query Definitions into Terraform state
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        working-directory: ./terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_db_password: ${{ env.SAFE_DB_PASSWORD }}
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_refresh_token_secret: ${{ secrets.REFRESH_TOKEN_SECRET }}
          TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
          TF_VAR_enable_custom_domain: ${{ github.event.inputs.enable_custom_domain }}
          TF_VAR_custom_domain: ${{ github.event.inputs.custom_domain }}
          TF_VAR_internal_automation_token: ${{ secrets.INTERNAL_AUTOMATION_TOKEN }}
        run: |
          P="${{ env.PROJECT_NAME }}"
          E="${{ env.ENVIRONMENT }}"

          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ env.AWS_REGION }}"

          import_cw_query() {
            local addr="$1" name="$2"
            local qid arn
            qid=$(aws logs describe-query-definitions \
              --query-definition-name-prefix "${name}" \
              --query "queryDefinitions[?name=='${name}'].queryDefinitionId | [0]" \
              --output text 2>/dev/null)
            if [ -n "$qid" ] && [ "$qid" != "None" ] && [ "$qid" != "null" ]; then
              arn="arn:aws:logs:${REGION}:${ACCOUNT}:query-definition:${qid}"
              echo "Importing CW query definition ${name}: ${arn}"
              terraform state rm "$addr" 2>/dev/null || true
              terraform import -input=false "$addr" "$arn" 2>&1 | grep -v "^$" || true
            else
              echo "No existing CW query definition ${name} — Terraform will create it"
            fi
          }

          import_cw_query \
            "module.eventbridge.aws_cloudwatch_query_definition.rag_latency_and_miss_rate" \
            "${P}/${E}/RAG/LatencyAndMissRate"
          import_cw_query \
            "module.eventbridge.aws_cloudwatch_query_definition.rag_similarity_distribution" \
            "${P}/${E}/RAG/SimilarityDistribution"

          echo "CloudWatch query definition import complete"

      # ── Step 4d: Import DNS resources into Terraform state ────────────────────
      # When enable_custom_domain=true the Route 53 zone and ACM certificate
      # survive the cleanup step (AWS doesn't delete them). Re-import them so
      # Terraform updates in place rather than failing to create duplicates.
      # Skipped automatically when enable_custom_domain=false (no zone exists).
      - name: Import DNS into Terraform state
        if: ${{ github.event.inputs.skip_terraform != 'true' && github.event.inputs.enable_custom_domain == 'true' && github.event.inputs.custom_domain != '' }}
        working-directory: ./terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_db_password: ${{ env.SAFE_DB_PASSWORD }}
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_refresh_token_secret: ${{ secrets.REFRESH_TOKEN_SECRET }}
          TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
          TF_VAR_enable_custom_domain: ${{ github.event.inputs.enable_custom_domain }}
          TF_VAR_custom_domain: ${{ github.event.inputs.custom_domain }}
          TF_VAR_internal_automation_token: ${{ secrets.INTERNAL_AUTOMATION_TOKEN }}
        run: |
          DOMAIN="${{ github.event.inputs.custom_domain }}"

          # Import Route 53 hosted zone if one already exists for this domain
          ZONE_ID=$(aws route53 list-hosted-zones-by-name \
            --dns-name "${DOMAIN}." \
            --query "HostedZones[?Name=='${DOMAIN}.'].Id | [0]" \
            --output text 2>/dev/null | sed 's|/hostedzone/||')
          if [ -n "$ZONE_ID" ] && [ "$ZONE_ID" != "None" ] && [ "$ZONE_ID" != "null" ]; then
            echo "Importing Route 53 zone: ${ZONE_ID}"
            terraform state rm 'module.dns[0].aws_route53_zone.main' 2>/dev/null || true
            terraform import -input=false \
              'module.dns[0].aws_route53_zone.main' "${ZONE_ID}" \
              2>&1 | grep -v "^$" || true
          else
            echo "No existing Route 53 zone for ${DOMAIN} — Terraform will create it"
          fi

          # Import ACM certificate if one already exists for this domain (us-east-1)
          CERT_ARN=$(aws acm list-certificates \
            --region us-east-1 \
            --query "CertificateSummaryList[?DomainName=='${DOMAIN}'].CertificateArn | [0]" \
            --output text 2>/dev/null)
          if [ -n "$CERT_ARN" ] && [ "$CERT_ARN" != "None" ] && [ "$CERT_ARN" != "null" ]; then
            echo "Importing ACM certificate: ${CERT_ARN}"
            terraform state rm 'module.dns[0].aws_acm_certificate.cert' 2>/dev/null || true
            terraform import -input=false \
              'module.dns[0].aws_acm_certificate.cert' "${CERT_ARN}" \
              2>&1 | grep -v "^$" || true
          else
            echo "No existing ACM certificate for ${DOMAIN} — Terraform will create it"
          fi

          echo "DNS import complete"

      # ── Step 4e: Import CloudFront into Terraform state ───────────────────────
      # When enable_cloudfront=true, a previous partial apply may have created the
      # OAC and/or distribution before failing. Import them so Terraform updates
      # in place rather than failing with "resource already exists".
      - name: Import CloudFront into Terraform state
        if: ${{ github.event.inputs.skip_terraform != 'true' && github.event.inputs.enable_cloudfront == 'true' }}
        working-directory: ./terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_db_password: ${{ env.SAFE_DB_PASSWORD }}
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_refresh_token_secret: ${{ secrets.REFRESH_TOKEN_SECRET }}
          TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
          TF_VAR_enable_custom_domain: ${{ github.event.inputs.enable_custom_domain }}
          TF_VAR_custom_domain: ${{ github.event.inputs.custom_domain }}
          TF_VAR_internal_automation_token: ${{ secrets.INTERNAL_AUTOMATION_TOKEN }}
        run: |
          P="${{ env.PROJECT_NAME }}"
          E="${{ env.ENVIRONMENT }}"

          # Import OAC if it already exists
          OAC_ID=$(aws cloudfront list-origin-access-controls \
            --query "OriginAccessControlList.Items[?Name=='${P}-${E}-oac'].Id | [0]" \
            --output text 2>/dev/null)
          if [ -n "$OAC_ID" ] && [ "$OAC_ID" != "None" ] && [ "$OAC_ID" != "null" ]; then
            echo "Importing CloudFront OAC: ${OAC_ID}"
            terraform state rm 'module.cloudfront[0].aws_cloudfront_origin_access_control.web' 2>/dev/null || true
            terraform import -input=false \
              'module.cloudfront[0].aws_cloudfront_origin_access_control.web' "${OAC_ID}" \
              2>&1 | grep -v "^$" || true
          else
            echo "No existing CloudFront OAC — Terraform will create it"
          fi

          # Import CloudFront distribution if it already exists.
          # Search by OAC name first (reliable after our own deploys), then fall back
          # to searching by custom_domain alias (catches manually-created distributions).
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='${P}-${E}'].Id | [0]" \
            --output text 2>/dev/null)
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ] || [ "$DIST_ID" = "null" ]; then
            CF_DOMAIN="${{ github.event.inputs.custom_domain }}"
            if [ -n "$CF_DOMAIN" ]; then
              ALL_DISTS=$(aws cloudfront list-distributions --output json 2>/dev/null || echo '{"DistributionList":{"Items":[]}}')
              DIST_ID=$(echo "$ALL_DISTS" | jq -r --arg d "$CF_DOMAIN" \
                '.DistributionList.Items[]? | select(any(.Aliases.Items[]?; . == $d)) | .Id' 2>/dev/null | head -1)
            fi
          fi
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ] && [ "$DIST_ID" != "null" ]; then
            echo "Importing CloudFront distribution: ${DIST_ID}"
            terraform state rm 'module.cloudfront[0].aws_cloudfront_distribution.web' 2>/dev/null || true
            terraform import -input=false \
              'module.cloudfront[0].aws_cloudfront_distribution.web' "${DIST_ID}" \
              2>&1 | grep -v "^$" || true
          else
            echo "No existing CloudFront distribution — Terraform will create it"
          fi

          echo "CloudFront import complete"

      # ── Step 5: Terraform Plan + Apply ────────────────────────────────────────
      - name: Terraform Plan
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        working-directory: ./terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_db_password: ${{ env.SAFE_DB_PASSWORD }}
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_refresh_token_secret: ${{ secrets.REFRESH_TOKEN_SECRET }}
          TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
          TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_lambda_image_uri: ${{ env.IMAGE_URI }}
          TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
          TF_VAR_enable_custom_domain: ${{ github.event.inputs.enable_custom_domain }}
          TF_VAR_custom_domain: ${{ github.event.inputs.custom_domain }}
          TF_VAR_internal_automation_token: ${{ secrets.INTERNAL_AUTOMATION_TOKEN }}
        run: terraform plan -out=tfplan -input=false

      - name: Terraform Apply
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        working-directory: ./terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_db_password: ${{ env.SAFE_DB_PASSWORD }}
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_refresh_token_secret: ${{ secrets.REFRESH_TOKEN_SECRET }}
          TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
          TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_lambda_image_uri: ${{ env.IMAGE_URI }}
          TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
          TF_VAR_enable_custom_domain: ${{ github.event.inputs.enable_custom_domain }}
          TF_VAR_custom_domain: ${{ github.event.inputs.custom_domain }}
          TF_VAR_internal_automation_token: ${{ secrets.INTERNAL_AUTOMATION_TOKEN }}
        run: terraform apply tfplan

      # ── Capture Terraform outputs ─────────────────────────────────────────────
      - name: Read Terraform outputs
        id: tf
        working-directory: ./terraform
        run: |
          echo "api_url=$(terraform output -raw api_endpoint | sed 's|/$||')" >> $GITHUB_OUTPUT
          echo "s3_bucket=$(terraform output -raw s3_bucket_name)"      >> $GITHUB_OUTPUT
          echo "cf_domain=$(terraform output -raw cloudfront_domain)"   >> $GITHUB_OUTPUT
          echo "cf_id=$(terraform output -raw cloudfront_id)"           >> $GITHUB_OUTPUT
          echo "frontend_url=$(terraform output -raw frontend_url)"     >> $GITHUB_OUTPUT
          echo "ws_url=$(terraform output -raw websocket_endpoint)"     >> $GITHUB_OUTPUT
          echo "name_servers=$(terraform output -json name_servers 2>/dev/null || echo '[]')" >> $GITHUB_OUTPUT

      # ── Compute effective API URL for frontend ────────────────────────────────
      # When CloudFront is enabled, the frontend routes /api/* through CloudFront
      # (same-origin) rather than directly hitting API Gateway. This avoids CORS
      # entirely for same-origin requests and enables caching at the edge.
      # Priority: custom domain > CloudFront domain > raw API Gateway URL.
      - name: Compute effective API URL
        run: |
          DOMAIN="${{ github.event.inputs.custom_domain }}"
          CF="${{ github.event.inputs.enable_cloudfront }}"
          if [ -n "$DOMAIN" ] && [ "$CF" = "true" ]; then
            echo "EFFECTIVE_API_URL=https://${DOMAIN}" >> $GITHUB_ENV
          elif [ "$CF" = "true" ]; then
            echo "EFFECTIVE_API_URL=https://${{ steps.tf.outputs.cf_domain }}" >> $GITHUB_ENV
          else
            echo "EFFECTIVE_API_URL=${{ steps.tf.outputs.api_url }}" >> $GITHUB_ENV
          fi

      # ── Step 6: Build and deploy frontend ────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend (Next.js static export)
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ env.EFFECTIVE_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ steps.tf.outputs.frontend_url }}
          NEXT_PUBLIC_VOICE_WS_URL: ${{ steps.tf.outputs.ws_url }}
          NEXT_OUTPUT: export
        run: npm run build

      # FIX: The second `aws s3 sync` MUST use `--exclude "*"` before `--include "*.html"`.
      # Without `--exclude "*"`, the AWS CLI treats `--include` as additive and syncs
      # ALL files again — overwriting the immutable cache headers set in pass 1.
      - name: Sync frontend to S3
        run: |
          set -euo pipefail
          BUCKET="${{ steps.tf.outputs.s3_bucket }}"

          # Pass 1: immutable assets (JS, CSS, fonts, images) — long-lived cache
          aws s3 sync frontend/out/ "s3://${BUCKET}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --region "${{ env.AWS_REGION }}"

          # Pass 2: HTML files only — always revalidate
          # --exclude "*" MUST come before --include "*.html" to scope the filter
          aws s3 sync frontend/out/ "s3://${BUCKET}/" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --region "${{ env.AWS_REGION }}"

          # Pass 3: Extension-less copies for clean URL routing.
          # Next.js App Router static export generates flat `login.html` files.
          # S3 website hosting only serves /login.html for the exact key "login.html",
          # NOT for the URL "/login". Copy each route HTML as an extension-less key
          # so S3 serves /login, /dashboard, etc. directly without CloudFront.
          # index.html and 404.html are excluded (served by S3 website config already).
          while IFS= read -r key; do
            route="${key%.html}"
            aws s3 cp "s3://${BUCKET}/${key}" "s3://${BUCKET}/${route}" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --metadata-directive REPLACE \
              --region "${{ env.AWS_REGION }}"
          done < <(aws s3 ls "s3://${BUCKET}/" --recursive --region "${{ env.AWS_REGION }}" \
            | awk '/\.html$/ {print $4}' \
            | grep -v -E '^(index|404|_not-found)\.html$')

      # ── Step 7: Invalidate CloudFront (skipped when CF is disabled) ──────────
      - name: Invalidate CloudFront
        if: ${{ steps.tf.outputs.cf_id != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.cf_id }}" \
            --paths "/*"

      # ── Step 8: Smoke test — verify the API is live ───────────────────────────
      # Polls /api/health up to 6 minutes to allow Lambda cold-start + DB init.
      # Initial 60s wait avoids hammering the Lambda while it initialises
      # (NestJS + updateSchema + seed can take 30-45s on first cold start).
      # 20s poll interval keeps concurrent invocations below 2 so the reserved
      # concurrency of 4 is never saturated by health-check traffic alone.
      - name: API smoke test
        run: |
          set -euo pipefail
          API="${{ steps.tf.outputs.api_url }}"
          echo "Waiting 60s for Lambda cold-start + DB initialisation ..."
          sleep 60
          echo "Polling ${API}/api/health ..."
          for i in $(seq 1 18); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 15 --max-time 45 \
              "${API}/api/health" || echo "000")
            echo "  Attempt $i/18 — HTTP ${HTTP}"
            if [ "$HTTP" = "200" ]; then
              echo "  API is live"
              break
            fi
            if [ "$i" = "18" ]; then
              echo "ERROR: API did not return 200 after 18 attempts (~6 min total)"
              echo "Check CloudWatch Logs: /aws/lambda/${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-api"
              exit 1
            fi
            sleep 20
          done

      # ── Summary ───────────────────────────────────────────────────────────────
      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend   | ${{ steps.tf.outputs.frontend_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API        | ${{ steps.tf.outputs.api_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| WebSocket  | ${{ steps.tf.outputs.ws_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| S3 Bucket  | ${{ steps.tf.outputs.s3_bucket }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image      | ${{ env.IMAGE_URI }} |" >> $GITHUB_STEP_SUMMARY

          # Custom domain + nameserver instructions
          DOMAIN="${{ github.event.inputs.custom_domain }}"
          NS='${{ steps.tf.outputs.name_servers }}'
          if [ -n "$DOMAIN" ] && [ "$NS" != "[]" ] && [ -n "$NS" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Custom Domain: ${DOMAIN}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Update your registrar's nameservers to:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${NS}" | tr -d '[]"' | tr ',' '\n' | sed 's/^ *//' | grep -v '^$' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "> DNS propagation takes 5–60 minutes after updating the registrar." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cost notes:**" >> $GITHUB_STEP_SUMMARY
          echo "- Aurora Serverless v2: ~\$43/mo (0.5 ACU min)" >> $GITHUB_STEP_SUMMARY
          echo "- NAT Gateway: ~\$32/mo — destroy with:" >> $GITHUB_STEP_SUMMARY
          echo "  \`terraform destroy -target='module.vpc.aws_nat_gateway.main' -target='module.vpc.aws_eip.nat'\`" >> $GITHUB_STEP_SUMMARY
