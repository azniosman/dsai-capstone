      run: "P=\"${{ env.PROJECT_NAME }}\"\nE=\"${{ env.ENVIRONMENT }}\"\n\nACCOUNT=$(aws\
        \ sts get-caller-identity --query Account --output text)\nREGION=\"${{ env.AWS_REGION\
        \ }}\"\n\nimport_cw_query() {\n  local addr=\"$1\" name=\"$2\"\n  local qid\
        \ arn\n  qid=$(aws logs describe-query-definitions \\\n    --query-definition-name-prefix\
        \ \"${name}\" \\\n    --query \"queryDefinitions[?name=='${name}'].queryDefinitionId\
        \ | [0]\" \\\n    --output text 2>/dev/null)\n  if [ -n \"$qid\" ] && [ \"\
        $qid\" != \"None\" ] && [ \"$qid\" != \"null\" ]; then\n    arn=\"arn:aws:logs:${REGION}:${ACCOUNT}:query-definition:${qid}\"\
        \n    echo \"Importing CW query definition ${name}: ${arn}\"\n    terraform\
        \ state rm \"$addr\" 2>/dev/null || true\n    terraform import -input=false\
        \ \"$addr\" \"$arn\" 2>&1 | grep -v \"^$\" || true\n  else\n    echo \"No\
        \ existing CW query definition ${name} \u2014 Terraform will create it\"\n\
        \  fi\n}\n\nimport_cw_query \\\n  \"module.eventbridge.aws_cloudwatch_query_definition.rag_latency_and_miss_rate\"\
        \ \\\n  \"${P}/${E}/RAG/LatencyAndMissRate\"\nimport_cw_query \\\n  \"module.eventbridge.aws_cloudwatch_query_definition.rag_similarity_distribution\"\
        \ \\\n  \"${P}/${E}/RAG/SimilarityDistribution\"\n\necho \"CloudWatch query\
        \ definition import complete\"\n"
    - name: Import DNS into Terraform state
      if: ${{ github.event.inputs.skip_terraform != 'true' && github.event.inputs.enable_custom_domain
