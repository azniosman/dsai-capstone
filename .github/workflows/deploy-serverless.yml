        $DIST_ID\" = \"None\" ] || [ \"$DIST_ID\" = \"null\" ]; then\n  CF_DOMAIN=\"\
        ${{ github.event.inputs.custom_domain }}\"\n  if [ -n \"$CF_DOMAIN\" ]; then\n\
        \    ALL_DISTS=$(aws cloudfront list-distributions --output json 2>/dev/null\
        \ || echo '{\"DistributionList\":{\"Items\":[]}}')\n    DIST_ID=$(echo \"\
        $ALL_DISTS\" | jq -r --arg d \"$CF_DOMAIN\" \\\n      '.DistributionList.Items[]?\
        \ | select(any(.Aliases.Items[]?; . == $d)) | .Id' 2>/dev/null | head -1)\n\
        \  fi\nfi\nif [ -n \"$DIST_ID\" ] && [ \"$DIST_ID\" != \"None\" ] && [ \"\
        $DIST_ID\" != \"null\" ]; then\n  echo \"Importing CloudFront distribution:\
        \ ${DIST_ID}\"\n  terraform state rm 'module.cloudfront[0].aws_cloudfront_distribution.web'\
        \ 2>/dev/null || true\n  terraform import -input=false \\\n    'module.cloudfront[0].aws_cloudfront_distribution.web'\
        \ \"${DIST_ID}\" \\\n    2>&1 | grep -v \"^$\" || true\nelse\n  echo \"No\
        \ existing CloudFront distribution \u2014 Terraform will create it\"\nfi\n\
        \necho \"CloudFront import complete\"\n"
    - name: Terraform Plan
