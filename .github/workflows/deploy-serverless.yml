name: Deploy Serverless Stack
true:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
        - dev
        - prod
      skip_terraform:
        description: Skip Terraform apply (image + frontend only)
        required: false
        default: false
        type: boolean
      enable_cloudfront:
        description: Enable CloudFront (requires AWS account verification)
        required: false
        default: false
        type: boolean
      enable_custom_domain:
        description: Provision Route 53 DNS zone and ACM certificates for custom domain
        required: false
        default: false
        type: boolean
      custom_domain:
        description: The apex domain to attach (e.g., 'sklbr.co')
        required: false
        default: ''
        type: string
permissions:
  contents: read
env:
  AWS_REGION: us-east-1
  PROJECT_NAME: skillbridge
  TF_VERSION: 1.9.0
  NODE_VERSION: '20'
jobs:
  deploy:
    name: Build & Deploy (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Preflight checks
      if: ${{ github.event.inputs.skip_terraform != 'true' }}
      run: "P=\"${{ env.PROJECT_NAME }}\"\nE=\"${{ env.ENVIRONMENT }}\"\necho \"===\
        \ Preflight checks for $E environment ===\"\n\n# Verify VPC cleanup worked\
        \ (should have deleted orphaned VPCs)\nVPC_COUNT=$(aws ec2 describe-vpcs \\\
        \n  --query 'Vpcs[].VpcId' --output text 2>/dev/null | wc -w | tr -d ' ')\n\
        echo \"  Current VPCs: $VPC_COUNT\"\n\n# Check if uploads bucket already exists\
        \ (should be cleaned up first)\nUPLOADS_BUCKET=\"${P}-${E}-uploads\"\nif aws\
        \ s3api head-bucket --bucket \"$UPLOADS_BUCKET\" 2>/dev/null; then\n  echo\
        \ \"  ERROR: Uploads bucket $UPLOADS_BUCKET already exists.\"\n  echo \" \
        \ Please run the workflow with skip_terraform=false first to clean up.\"\n\
        \  exit 1\nfi\n\necho \"  Preflight checks passed\"\n"
    - name: Sanitize DB password for Aurora compatibility
      run: "SAFE=$(printf '%s' \"$RAW\" | tr -d '/@\" ')\nif [ ${#SAFE} -lt 8 ]; then\n\
        \  echo \"ERROR: DB_PASSWORD is too short after sanitization (< 8 chars).\"\
        \n  echo \"Regenerate with: openssl rand -hex 24\"\n  exit 1\nfi\necho \"\
        SAFE_DB_PASSWORD=${SAFE}\" >> $GITHUB_ENV\n"
      env:
        RAW: ${{ secrets.DB_PASSWORD }}
    - name: Compute CORS allowed origins
      run: "DOMAIN=\"${{ github.event.inputs.custom_domain }}\"\nif [ -n \"$DOMAIN\"\
        \ ]; then\n  CORS=\"[\\\"https://${DOMAIN}\\\",\\\"http://localhost:3000\\\
        \",\\\"http://localhost:5173\\\"]\"\nelse\n  CORS='[\"http://localhost:3000\"\
        ,\"http://localhost:5173\"]'\nfi\necho \"TF_VAR_cors_allowed_origins=${CORS}\"\
        \ >> $GITHUB_ENV\n"
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    - name: Cleanup orphaned VPCs
      run: bash .github/workflows/delete_orphaned_vpcs.sh
    - name: Terraform fmt check
      working-directory: ./terraform
      run: terraform fmt -check -recursive
    - name: Ensure Terraform state bucket exists
      if: ${{ github.event.inputs.skip_terraform != 'true' }}
      run: "ACCOUNT=$(aws sts get-caller-identity --query Account --output text)\n\
        STATE_BUCKET=\"skillbridge-tfstate-${ACCOUNT}-${{ env.ENVIRONMENT }}\"\necho\
        \ \"STATE_BUCKET=${STATE_BUCKET}\" >> $GITHUB_ENV\n\n# us-east-1 does NOT\
        \ use --create-bucket-configuration\naws s3api create-bucket \\\n  --bucket\
        \ \"$STATE_BUCKET\" \\\n  --region \"${{ env.AWS_REGION }}\" 2>/dev/null ||\
        \ true\n\n# Versioning preserves state file history\naws s3api put-bucket-versioning\
        \ \\\n  --bucket \"$STATE_BUCKET\" \\\n  --versioning-configuration Status=Enabled\
        \ 2>/dev/null || true\n\n# Block all public access on state bucket\naws s3api\
        \ put-public-access-block \\\n  --bucket \"$STATE_BUCKET\" \\\n  --public-access-block-configuration\
        \ \\\n    BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true\
        \ \\\n  2>/dev/null || true\n\n# Enable SSE-S3 encryption\naws s3api put-bucket-encryption\
        \ \\\n  --bucket \"$STATE_BUCKET\" \\\n  --server-side-encryption-configuration\
        \ \\\n    '{\"Rules\":[{\"ApplyServerSideEncryptionByDefault\":{\"SSEAlgorithm\"\
        :\"AES256\"}}]}' \\\n  2>/dev/null || true\n\necho \"State bucket: $STATE_BUCKET\"\
        \n"
    - name: Terraform Init
      if: ${{ github.event.inputs.skip_terraform != 'true' }}
      working-directory: ./terraform
      run: "terraform init \\\n  -upgrade \\\n  -input=false \\\n  -backend-config=\"\
        bucket=${{ env.STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ env.ENVIRONMENT\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=${{ env.AWS_REGION\
        \ }}\" \\\n  -backend-config=\"encrypt=true\"\n"
    - name: Terraform Init (skip_terraform path)
      if: ${{ github.event.inputs.skip_terraform == 'true' }}
      working-directory: ./terraform
      run: "ACCOUNT=$(aws sts get-caller-identity --query Account --output text)\n\
        STATE_BUCKET=\"skillbridge-tfstate-${ACCOUNT}-${{ env.ENVIRONMENT }}\"\necho\
        \ \"STATE_BUCKET=${STATE_BUCKET}\" >> $GITHUB_ENV\nterraform init \\\n  -upgrade\
        \ \\\n  -input=false \\\n  -backend-config=\"bucket=${STATE_BUCKET}\" \\\n\
        \  -backend-config=\"key=${{ env.ENVIRONMENT }}/terraform.tfstate\" \\\n \
        \ -backend-config=\"region=${{ env.AWS_REGION }}\" \\\n  -backend-config=\"\
        encrypt=true\"\n"
    - name: Terraform validate
      working-directory: ./terraform
      run: terraform validate
    - name: Create ECR repository
      if: ${{ github.event.inputs.skip_terraform != 'true' }}
      working-directory: ./terraform
      env:
        TF_VAR_aws_region: ${{ env.AWS_REGION }}
        TF_VAR_environment: ${{ env.ENVIRONMENT }}
        TF_VAR_db_password: ${{ env.SAFE_DB_PASSWORD }}
        TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
        TF_VAR_refresh_token_secret: ${{ secrets.REFRESH_TOKEN_SECRET }}
        TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
        TF_VAR_enable_custom_domain: ${{ github.event.inputs.enable_custom_domain
          }}
        TF_VAR_custom_domain: ${{ github.event.inputs.custom_domain }}
        TF_VAR_internal_automation_token: ${{ secrets.INTERNAL_AUTOMATION_TOKEN }}
      run: "P=\"${{ env.PROJECT_NAME }}\"\nE=\"${{ env.ENVIRONMENT }}\"\n\n# Remove\
        \ from state first so import is idempotent on re-runs\nterraform state rm\
        \ module.ecr.aws_ecr_repository.backend 2>/dev/null || true\nterraform state\
        \ rm module.ecr.aws_ecr_lifecycle_policy.backend 2>/dev/null || true\n\n#\
        \ Import if the ECR repo already exists in AWS (re-run safety)\nterraform\
        \ import -input=false \\\n  module.ecr.aws_ecr_repository.backend \\\n  \"\
        ${P}-${E}-backend\" \\\n  2>&1 | grep -v \"^$\" || true\n\nterraform import\
        \ -input=false \\\n  module.ecr.aws_ecr_lifecycle_policy.backend \\\n  \"\
        ${P}-${E}-backend\" \\\n  2>&1 | grep -v \"^$\" || true\n\nterraform apply\
        \ -target=module.ecr -auto-approve -input=false\n"
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to ECR
      id: ecr-login
      uses: aws-actions/amazon-ecr-login@v2
    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile.lambda', 'nestjs-backend/package-lock.json')
          }}
        restore-keys: '${{ runner.os }}-buildx-

          '
    - name: Build and push Lambda image
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: "set -euo pipefail\nACCOUNT=$(aws sts get-caller-identity --query Account\
        \ --output text)\nECR=\"${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-${ENVIRONMENT}-backend\"\
        \n\ndocker buildx build \\\n  --platform linux/amd64 \\\n  -f Dockerfile.lambda\
        \ \\\n  --provenance=false \\\n  --cache-from \"type=local,src=/tmp/.buildx-cache\"\
        \ \\\n  --cache-to   \"type=local,dest=/tmp/.buildx-cache-new,mode=max\" \\\
        \n  -t \"${ECR}:${IMAGE_TAG}\" \\\n  -t \"${ECR}:latest\" \\\n  --push \\\n\
        \  .\n\n# Rotate cache to prevent unbounded growth\nrm -rf /tmp/.buildx-cache\n\
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache\n\necho \"IMAGE_URI=${ECR}:${IMAGE_TAG}\"\
        \ >> $GITHUB_ENV\n"
    - name: Update Lambda function code (skip_terraform path)
      if: ${{ github.event.inputs.skip_terraform == 'true' }}
      run: "set -euo pipefail\nP=\"${{ env.PROJECT_NAME }}\"\nE=\"${{ env.ENVIRONMENT\
        \ }}\"\nfor FN in api voice rag-query embed-gen gap-analysis resume-upload\
        \ \\\n          ssg-sync cache-cleanup recommendation-refresh \\\n       \
        \   embedding-backfill market-insights warmup; do\n  FNAME=\"${P}-${E}-${FN}\"\
        \n  if aws lambda get-function --function-name \"$FNAME\" &>/dev/null; then\n\
        \    echo \"Updating ${FNAME}...\"\n    aws lambda update-function-code \\\
        \n      --function-name \"$FNAME\" \\\n      --image-uri \"${{ env.IMAGE_URI\
        \ }}\" \\\n      --output text --query 'FunctionName'\n  else\n    echo \"\
        \  ${FNAME} not found \u2014 skipping\"\n  fi\ndone\n"
    - name: Clean up AWS resources for clean-slate Terraform apply
      if: ${{ github.event.inputs.skip_terraform != 'true' }}
      working-directory: ./terraform
      env:
        TF_VAR_aws_region: ${{ env.AWS_REGION }}
        TF_VAR_environment: ${{ env.ENVIRONMENT }}
        TF_VAR_db_password: ${{ env.SAFE_DB_PASSWORD }}
        TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
        TF_VAR_refresh_token_secret: ${{ secrets.REFRESH_TOKEN_SECRET }}
        TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
        TF_VAR_enable_custom_domain: ${{ github.event.inputs.enable_custom_domain
          }}
        TF_VAR_custom_domain: ${{ github.event.inputs.custom_domain }}
        TF_VAR_internal_automation_token: ${{ secrets.INTERNAL_AUTOMATION_TOKEN }}
      run: "# Disable bash -e for this entire step.\n# This is a delete/cleanup script:\
        \ every AWS CLI and terraform command\n# uses explicit \"|| true\" or structured\
        \ if/else for error handling.\n# bash -e causes the step to abort immediately\
        \ when any command\n# substitution (RESULT=$(aws ...)) returns non-zero, which\
        \ always\n# happens on a first deploy when no resources exist yet (exit 254).\n\
        set +e\n\nP=\"${{ env.PROJECT_NAME }}\"\nE=\"${{ env.ENVIRONMENT }}\"\nACCOUNT=$(aws\
        \ sts get-caller-identity --query Account --output text)\n\necho \"=== Step\
        \ 1: Remove non-ECR modules from Terraform state ===\"\n# module.iam is intentionally\
        \ kept in state so Terraform updates roles\n# in place rather than trying\
        \ to create them (avoids 409 EntityAlreadyExists\n# when IAM roles survive\
        \ the AWS cleanup due to attached managed policies).\n# module.eventbridge\
        \ is removed \u2014 schedules are re-imported in Step 4c.\nfor MOD in \\\n\
        \  module.vpc \\\n  module.security_groups \\\n  module.rds \\\n  module.lambda_backend\
        \ \\\n  module.api_gateway \\\n  module.s3_frontend \\\n  module.eventbridge;\
        \ do\n  terraform state rm \"$MOD\" 2>&1 | head -3 || true\ndone\n# Indexed\
        \ (count-based) modules use bracket notation\nterraform state rm 'module.cloudfront[0]'\
        \  2>/dev/null || true\nterraform state rm 'module.opensearch[0]'  2>/dev/null\
        \ || true\nterraform state rm 'module.websocket[0]'   2>/dev/null || true\n\
        terraform state rm 'module.sagemaker[0]'   2>/dev/null || true\n# DNS module\
        \ (Route 53 zone + ACM cert) \u2014 zone persists in AWS; re-imported below\n\
        terraform state rm 'module.dns[0]'         2>/dev/null || true\n# CloudFront\
        \ alias records (root-level resources in main.tf)\nterraform state rm 'aws_route53_record.cf_alias_root_a[0]'\
        \    2>/dev/null || true\nterraform state rm 'aws_route53_record.cf_alias_root_aaaa[0]'\
        \ 2>/dev/null || true\nterraform state rm 'aws_route53_record.cf_alias_www_a[0]'\
        \     2>/dev/null || true\nterraform state rm 'aws_route53_record.cf_alias_www_aaaa[0]'\
        \  2>/dev/null || true\n# Uploads bucket + internal-token secret (root-level\
        \ resources)\nterraform state rm 'aws_s3_bucket.uploads'                 \
        \         2>/dev/null || true\nterraform state rm 'aws_s3_bucket_public_access_block.uploads'\
        \      2>/dev/null || true\nterraform state rm 'aws_s3_bucket_server_side_encryption_configuration.uploads'\
        \ 2>/dev/null || true\nterraform state rm 'aws_secretsmanager_secret.internal_token'\
        \        2>/dev/null || true\nterraform state rm 'aws_secretsmanager_secret_version.internal_token'\
        \ 2>/dev/null || true\n\necho \"=== Step 2: Kick off Aurora cluster deletion\
        \ (async) ===\"\nCLUSTER_ID=\"${P}-${E}-aurora\"\nfor INST in $(aws rds describe-db-clusters\
        \ \\\n  --db-cluster-identifier \"$CLUSTER_ID\" \\\n  --query 'DBClusters[0].DBClusterMembers[].DBInstanceIdentifier'\
        \ \\\n  --output text 2>/dev/null | tr '\\t' '\\n'); do\n  echo \"  Deleting\
        \ Aurora instance: $INST\"\n  aws rds delete-db-instance \\\n    --db-instance-identifier\
        \ \"$INST\" \\\n    --skip-final-snapshot 2>/dev/null || true\ndone\naws rds\
        \ delete-db-cluster \\\n  --db-cluster-identifier \"$CLUSTER_ID\" \\\n  --skip-final-snapshot\
        \ 2>/dev/null || true\n\necho \"=== Step 3: Delete Lambda functions, API Gateway,\
        \ CWL log groups ===\"\nfor FN in api voice rag-query embed-gen gap-analysis\
        \ resume-upload \\\n          ssg-sync cache-cleanup recommendation-refresh\
        \ \\\n          embedding-backfill market-insights warmup; do\n  aws lambda\
        \ delete-function \\\n    --function-name \"${P}-${E}-${FN}\" 2>/dev/null\
        \ || true\ndone\n# Delete both the HTTP API and ALL WebSocket voice-ws APIs\
        \ (avoid duplicates)\nfor API_NAME in \"${P}-${E}-api\" \"${P}-${E}-voice-ws\"\
        ; do\n  API_IDS=$(aws apigatewayv2 get-apis \\\n    --query \"Items[?Name=='${API_NAME}'].ApiId\"\
        \ \\\n    --output text 2>/dev/null || echo \"\")\n  for AID in $API_IDS;\
        \ do\n    [ -z \"$AID\" ] || [ \"$AID\" = \"None\" ] && continue\n    echo\
        \ \"  Deleting API Gateway: ${API_NAME} (${AID})\"\n    aws apigatewayv2 delete-api\
        \ --api-id \"$AID\" 2>/dev/null || true\n  done\ndone\nfor LG in \\\n  \"\
        /aws/lambda/${P}-${E}-api\" \\\n  \"/aws/lambda/${P}-${E}-voice\" \\\n  \"\
        /aws/lambda/${P}-${E}-rag-query\" \\\n  \"/aws/lambda/${P}-${E}-embed-gen\"\
        \ \\\n  \"/aws/lambda/${P}-${E}-gap-analysis\" \\\n  \"/aws/lambda/${P}-${E}-resume-upload\"\
        \ \\\n  \"/aws/lambda/${P}-${E}-ssg-sync\" \\\n  \"/aws/lambda/${P}-${E}-cache-cleanup\"\
        \ \\\n  \"/aws/lambda/${P}-${E}-recommendation-refresh\" \\\n  \"/aws/lambda/${P}-${E}-embedding-backfill\"\
        \ \\\n  \"/aws/lambda/${P}-${E}-market-insights\" \\\n  \"/aws/lambda/${P}-${E}-warmup\"\
        \ \\\n  \"/aws/apigateway/${P}-${E}\"; do\n  aws logs delete-log-group --log-group-name\
        \ \"$LG\" 2>/dev/null || true\ndone\n\n# Step 4: IAM roles and policies are\
        \ intentionally NOT deleted here.\n# module.iam is kept in Terraform state\
        \ (see Step 1 comment) so Terraform\n# updates roles in place on re-deploy\
        \ rather than attempting to create them.\n\necho \"=== Step 4: Delete Secrets\
        \ Manager secret ===\"\naws secretsmanager delete-secret \\\n  --secret-id\
        \ \"${P}/internal-token\" \\\n  --force-delete-without-recovery 2>/dev/null\
        \ || true\n\necho \"=== Step 5: Delete ALL project-tagged VPCs and their dependencies\
        \ ===\"\nfor VPC_ID in $(aws ec2 describe-vpcs \\\n  --filters \"Name=tag:Name,Values=${P}-${E}-vpc\"\
        \ \\\n  --query 'Vpcs[].VpcId' --output text 2>/dev/null | tr '\\t' '\\n');\
        \ do\n  [ -z \"$VPC_ID\" ] || [ \"$VPC_ID\" = \"None\" ] && continue\n  echo\
        \ \"  Cleaning VPC: $VPC_ID\"\n\n  # \u2500\u2500 FIX: Delete Lambda/RDS Elastic\
        \ Network Interfaces first \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\n  # Lambda functions in VPCs create ENIs that persist for up\
        \ to 20 min\n  # after the function is deleted. These block subnet deletion.\n\
        \  # We must explicitly detach + delete them before touching subnets.\n  echo\
        \ \"  Waiting for Lambda ENIs to become 'available' (up to 3 min)...\"\n \
        \ for i in $(seq 1 18); do\n    IN_USE=$(aws ec2 describe-network-interfaces\
        \ \\\n      --filters \"Name=vpc-id,Values=$VPC_ID\" \"Name=status,Values=in-use\"\
        \ \\\n      --query 'NetworkInterfaces[?Description!=`null`] | length(@)'\
        \ \\\n      --output text 2>/dev/null || echo \"0\")\n    [ \"$IN_USE\" =\
        \ \"0\" ] && break\n    echo \"    $IN_USE ENIs still in-use ($i/18)...\"\n\
        \    sleep 10\n  done\n  for ENI in $(aws ec2 describe-network-interfaces\
        \ \\\n    --filters \"Name=vpc-id,Values=$VPC_ID\" \"Name=status,Values=available\"\
        \ \\\n    --query 'NetworkInterfaces[].NetworkInterfaceId' \\\n    --output\
        \ text 2>/dev/null | tr '\\t' '\\n'); do\n    [ -z \"$ENI\" ] && continue\n\
        \    echo \"    Deleting ENI: $ENI\"\n    aws ec2 delete-network-interface\
        \ \\\n      --network-interface-id \"$ENI\" 2>/dev/null || true\n  done\n\n\
        \  # Security Groups (non-default)\n  for SG in $(aws ec2 describe-security-groups\
        \ \\\n    --filters \"Name=vpc-id,Values=$VPC_ID\" \\\n    --query 'SecurityGroups[?GroupName\
        \ != `default`].GroupId' \\\n    --output text 2>/dev/null | tr '\\t' '\\\
        n'); do\n    aws ec2 delete-security-group --group-id \"$SG\" 2>/dev/null\
        \ || true\n  done\n\n  # NAT Gateways (async delete)\n  for NAT in $(aws ec2\
        \ describe-nat-gateways \\\n    --filter \"Name=vpc-id,Values=$VPC_ID\" \\\
        \n             \"Name=state,Values=available,pending\" \\\n    --query 'NatGateways[].NatGatewayId'\
        \ \\\n    --output text 2>/dev/null | tr '\\t' '\\n'); do\n    aws ec2 delete-nat-gateway\
        \ --nat-gateway-id \"$NAT\" 2>/dev/null || true\n  done\n  # Wait for NAT\
        \ GW deletion (up to 3 min)\n  for i in $(seq 1 18); do\n    PENDING=$(aws\
        \ ec2 describe-nat-gateways \\\n      --filter \"Name=vpc-id,Values=$VPC_ID\"\
        \ \\\n               \"Name=state,Values=available,pending,deleting\" \\\n\
        \      --query 'NatGateways[].NatGatewayId' --output text 2>/dev/null)\n \
        \   [ -z \"$PENDING\" ] && break\n    echo \"  Waiting for NAT GW... ($i/18)\"\
        \n    sleep 10\n  done\n\n  # Internet Gateway\n  for IGW in $(aws ec2 describe-internet-gateways\
        \ \\\n    --filters \"Name=attachment.vpc-id,Values=$VPC_ID\" \\\n    --query\
        \ 'InternetGateways[].InternetGatewayId' \\\n    --output text 2>/dev/null\
        \ | tr '\\t' '\\n'); do\n    aws ec2 detach-internet-gateway \\\n      --internet-gateway-id\
        \ \"$IGW\" --vpc-id \"$VPC_ID\" 2>/dev/null || true\n    aws ec2 delete-internet-gateway\
        \ \\\n      --internet-gateway-id \"$IGW\" 2>/dev/null || true\n  done\n\n\
        \  # Route tables (non-main)\n  for RT in $(aws ec2 describe-route-tables\
        \ \\\n    --filters \"Name=vpc-id,Values=$VPC_ID\" \\\n    --query 'RouteTables[?Associations[0].Main\
        \ != `true`].RouteTableId' \\\n    --output text 2>/dev/null | tr '\\t' '\\\
        n'); do\n    aws ec2 delete-route-table --route-table-id \"$RT\" 2>/dev/null\
        \ || true\n  done\n\n  # Subnets (after ENIs and NAT GW are gone)\n  for SUBNET\
        \ in $(aws ec2 describe-subnets \\\n    --filters \"Name=vpc-id,Values=$VPC_ID\"\
        \ \\\n    --query 'Subnets[].SubnetId' \\\n    --output text 2>/dev/null |\
        \ tr '\\t' '\\n'); do\n    aws ec2 delete-subnet --subnet-id \"$SUBNET\" 2>/dev/null\
        \ || true\n  done\n\n  aws ec2 delete-vpc --vpc-id \"$VPC_ID\" 2>/dev/null\
        \ || true\n  echo \"  Deleted VPC: $VPC_ID\"\ndone\n\necho \"=== Step 6: Release\
        \ unassociated project EIPs ===\"\nfor EIP in $(aws ec2 describe-addresses\
        \ \\\n  --filters \"Name=tag:Name,Values=${P}-${E}-nat-eip\" \\\n  --query\
        \ 'Addresses[].AllocationId' \\\n  --output text 2>/dev/null | tr '\\t' '\\\
        n'); do\n  [ -n \"$EIP\" ] && aws ec2 release-address \\\n    --allocation-id\
        \ \"$EIP\" 2>/dev/null || true\ndone\n\necho \"=== Step 7: Wait for Aurora\
        \ cluster deletion (up to 15 min) ===\"\nfor i in $(seq 1 90); do\n  STATUS=$(aws\
        \ rds describe-db-clusters \\\n    --db-cluster-identifier \"$CLUSTER_ID\"\
        \ \\\n    --query 'DBClusters[0].Status' \\\n    --output text 2>/dev/null\
        \ || echo \"gone\")\n  if [ \"$STATUS\" = \"gone\" ] || [ \"$STATUS\" = \"\
        None\" ] || [ -z \"$STATUS\" ]; then\n    echo \"  Aurora is gone \u2014 proceeding\"\
        \n    break\n  fi\n  echo \"  Aurora status: $STATUS ($i/90)\"\n  sleep 10\n\
        done\n\necho \"=== Step 8: Delete RDS subnet group + parameter group (with\
        \ retries) ===\"\nfor i in $(seq 1 60); do\n  RESULT=$(aws rds delete-db-subnet-group\
        \ \\\n    --db-subnet-group-name \"${P}-${E}-db-subnet\" 2>&1)\n  if [ $?\
        \ -eq 0 ] || echo \"$RESULT\" | grep -qi \"DBSubnetGroupNotFoundFault\\|Cannot\
        \ find\"; then\n    echo \"  Subnet group deleted (or already gone)\"\n  \
        \  break\n  fi\n  echo \"  Waiting for subnet group ($i/60): $RESULT\"\n \
        \ sleep 10\ndone\nfor i in $(seq 1 12); do\n  RESULT=$(aws rds delete-db-cluster-parameter-group\
        \ \\\n    --db-cluster-parameter-group-name \"${P}-${E}-aurora-pg16\" 2>&1)\n\
        \  if [ $? -eq 0 ] || echo \"$RESULT\" | grep -qi \"DBParameterGroupNotFoundFault\\\
        |Cannot find\"; then\n    echo \"  Cluster parameter group deleted (or already\
        \ gone)\"\n    break\n  fi\n  echo \"  Waiting for parameter group ($i/12):\
        \ $RESULT\"\n  sleep 10\ndone\naws rds delete-db-parameter-group \\\n  --db-parameter-group-name\
        \ \"${P}-${E}-pg16\" 2>/dev/null || true\n\necho \"=== Step 9: Delete Secrets\
        \ Manager secret ===\"\naws secretsmanager delete-secret \\\n  --secret-id\
        \ \"${P}/${E}/db-credentials\" \\\n  --force-delete-without-recovery 2>/dev/null\
        \ || true\n\necho \"=== Step 10: Empty + delete uploads S3 bucket (if it exists)\
        \ ===\"\nUPLOADS_BUCKET=\"${P}-${E}-uploads\"\n# Safety check: only proceed\
        \ if bucket exists AND has correct tags\n# This prevents accidentally deleting\
        \ buckets from other sources\nif aws s3api head-bucket --bucket \"$UPLOADS_BUCKET\"\
        \ 2>/dev/null; then\n  echo \"  Bucket $UPLOADS_BUCKET exists, verifying tags...\"\
        \n  # Verify bucket has the expected tag: Name=${P}-${E}-uploads\n  BUCKET_TAGS=$(aws\
        \ s3api get-bucket-tagging --bucket \"$UPLOADS_BUCKET\" 2>/dev/null)\n  EXPECTED_TAG=\"\
        \\\"Key\\\":\\\"Name\\\",\\\"Value\\\":\\\"${P}-${E}-uploads\\\"\"\n  if echo\
        \ \"$BUCKET_TAGS\" | grep -q \"$EXPECTED_TAG\"; then\n    echo \"  Bucket\
        \ tags verified, proceeding with deletion...\"\n    # Remove bucket policy\
        \ if it exists (can block deletion)\n    aws s3api delete-bucket-policy --bucket\
        \ \"$UPLOADS_BUCKET\" 2>/dev/null || true\n    # Remove any encryption configuration\n\
        \    aws s3api delete-bucket-encryption --bucket \"$UPLOADS_BUCKET\" 2>/dev/null\
        \ || true\n    # Remove public access block\n    aws s3api delete-public-access-block\
        \ --bucket \"$UPLOADS_BUCKET\" 2>/dev/null || true\n    # Empty the bucket\
        \ (including all versions if versioning was enabled)\n    aws s3 rm \"s3://${UPLOADS_BUCKET}\"\
        \ --recursive --include \"*\" 2>/dev/null || true\n    # Delete the bucket\n\
        \    aws s3api delete-bucket --bucket \"$UPLOADS_BUCKET\" \\\n      --region\
        \ \"${{ env.AWS_REGION }}\" 2>/dev/null || true\n    echo \"  Bucket $UPLOADS_BUCKET\
        \ deleted\"\n  else\n    echo \"  WARNING: Bucket $UPLOADS_BUCKET exists but\
        \ has unexpected tags. Skipping deletion.\"\n    echo \"  This may indicate\
        \ a bucket from another source. Manual intervention required.\"\n  fi\nelse\n\
        \  echo \"  Bucket $UPLOADS_BUCKET does not exist\"\nfi\n\necho \"=== Step\
        \ 11: Clear CNAME aliases from any existing CloudFront distributions ===\"\
        \n# CloudFront distributions with CNAME aliases (e.g. sklbr.co) must have\
        \ those\n# aliases removed before Terraform can create a new distribution\
        \ with the same CNAMEs.\n# Updating aliases on an enabled distribution is\
        \ instant and does not require disabling.\n# Search by actual alias value\
        \ (not by Comment) so we find distributions regardless\n# of how they were\
        \ originally created or what comment they were given.\nCF_DOMAIN=\"${{ github.event.inputs.custom_domain\
        \ }}\"\nif [ -n \"$CF_DOMAIN\" ]; then\n  ALL_DISTS=$(aws cloudfront list-distributions\
        \ --output json 2>/dev/null || echo '{\"DistributionList\":{\"Items\":[]}}')\n\
        \  for DIST_ID in $(echo \"$ALL_DISTS\" | jq -r --arg d \"$CF_DOMAIN\" \\\n\
        \    '.DistributionList.Items[]? | select(any(.Aliases.Items[]?; . == $d))\
        \ | .Id' 2>/dev/null); do\n    [ -z \"$DIST_ID\" ] || [ \"$DIST_ID\" = \"\
        None\" ] && continue\n    echo \"  Clearing CNAME aliases from CloudFront\
        \ distribution: $DIST_ID\"\n    ETAG=$(aws cloudfront get-distribution-config\
        \ --id \"$DIST_ID\" \\\n      --query 'ETag' --output text 2>/dev/null)\n\
        \    CONFIG=$(aws cloudfront get-distribution-config --id \"$DIST_ID\" \\\n\
        \      --query 'DistributionConfig' --output json 2>/dev/null)\n    if [ -n\
        \ \"$ETAG\" ] && [ \"$ETAG\" != \"None\" ]; then\n      UPDATED=$(echo \"\
        $CONFIG\" | jq '.Aliases = {\"Quantity\": 0, \"Items\": []}')\n      aws cloudfront\
        \ update-distribution \\\n        --id \"$DIST_ID\" \\\n        --distribution-config\
        \ \"$UPDATED\" \\\n        --if-match \"$ETAG\" \\\n        --output text\
        \ --query 'Distribution.Id' 2>/dev/null || true\n      echo \"  Aliases cleared\
        \ from $DIST_ID\"\n    fi\n  done\nfi\n\necho \"Cleanup complete \u2014 Terraform\
        \ will rebuild all resources from scratch\"\nexit 0\n"
