name: Deploy Serverless Stack

# Trigger on push to main or manual dispatch with environment selection.
# Uses OIDC (no static AWS credentials stored in GitHub Secrets).

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "terraform/**"
      - "data/seed/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]
      skip_terraform:
        description: "Skip Terraform apply (image + frontend only)"
        required: false
        default: "false"
        type: boolean

permissions:
  id-token: write # Required for OIDC JWT
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: skillbridge
  TF_VERSION: "1.9.0"
  NODE_VERSION: "20"

jobs:
  deploy:
    name: Build & Deploy (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── AWS Auth (OIDC — no static credentials) ────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Terraform — Init ───────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -upgrade -input=false

      # ── Step 1: Create ECR (targeted apply, idempotent) ────────────────────
      - name: Create ECR repository
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        working-directory: ./terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
        run: terraform apply -target=module.ecr -auto-approve -input=false

      # ── Step 2: Build and push Lambda container image ──────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Lambda image
        env:
          ACCOUNT_ID: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ECR="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-${ENVIRONMENT}-backend"

          docker build \
            --platform linux/amd64 \
            -f backend/Dockerfile.lambda \
            -t "${ECR}:${IMAGE_TAG}" \
            -t "${ECR}:latest" \
            .

          docker push "${ECR}:${IMAGE_TAG}"
          docker push "${ECR}:latest"

          echo "IMAGE_URI=${ECR}:${IMAGE_TAG}" >> $GITHUB_ENV

      # ── Step 3: Terraform Plan + Apply ────────────────────────────────────
      - name: Terraform Plan
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        working-directory: ./terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_lambda_image_uri: ${{ env.IMAGE_URI }}
        run: terraform plan -out=tfplan -input=false

      - name: Terraform Apply
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        working-directory: ./terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_lambda_image_uri: ${{ env.IMAGE_URI }}
        run: terraform apply -auto-approve tfplan

      # ── Capture Terraform outputs ─────────────────────────────────────────
      - name: Read Terraform outputs
        id: tf
        working-directory: ./terraform
        run: |
          echo "api_url=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT
          echo "s3_bucket=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "cf_domain=$(terraform output -raw cloudfront_domain)" >> $GITHUB_OUTPUT
          echo "cf_id=$(terraform output -raw cloudfront_id)" >> $GITHUB_OUTPUT

      # ── Step 4: Build and deploy frontend ─────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline

      - name: Build frontend (Next.js static export)
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.tf.outputs.api_url }}
          NEXT_PUBLIC_APP_URL: https://${{ steps.tf.outputs.cf_domain }}
        run: npm run build

      - name: Sync frontend to S3
        run: |
          # Upload immutable assets with long cache TTL
          aws s3 sync frontend/out/ "s3://${{ steps.tf.outputs.s3_bucket }}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --region "${{ env.AWS_REGION }}"

          # Upload HTML with no-cache so stale SPA shells are never served
          aws s3 sync frontend/out/ "s3://${{ steps.tf.outputs.s3_bucket }}/" \
            --delete \
            --cache-control "no-cache, no-store, must-revalidate" \
            --include "*.html" \
            --region "${{ env.AWS_REGION }}"

      # ── Step 5: Invalidate CloudFront cache ───────────────────────────────
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.cf_id }}" \
            --paths "/*"

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "## ✓ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | https://${{ steps.tf.outputs.cf_domain }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API | ${{ steps.tf.outputs.api_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| S3 Bucket | ${{ steps.tf.outputs.s3_bucket }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | ${{ env.IMAGE_URI }} |" >> $GITHUB_STEP_SUMMARY
