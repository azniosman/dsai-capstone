        TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
        TF_VAR_enable_custom_domain: ${{ github.event.inputs.enable_custom_domain
          }}
        TF_VAR_custom_domain: ${{ github.event.inputs.custom_domain }}
        TF_VAR_internal_automation_token: ${{ secrets.INTERNAL_AUTOMATION_TOKEN }}
      run: terraform plan -out=tfplan -input=false
    - name: Terraform Apply
      if: ${{ github.event.inputs.skip_terraform != 'true' }}
      working-directory: ./terraform
      env:
        TF_VAR_aws_region: ${{ env.AWS_REGION }}
        TF_VAR_environment: ${{ env.ENVIRONMENT }}
        TF_VAR_db_password: ${{ env.SAFE_DB_PASSWORD }}
        TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
        TF_VAR_refresh_token_secret: ${{ secrets.REFRESH_TOKEN_SECRET }}
        TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
        TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
        TF_VAR_lambda_image_uri: ${{ env.IMAGE_URI }}
        TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
        TF_VAR_enable_custom_domain: ${{ github.event.inputs.enable_custom_domain
          }}
        TF_VAR_custom_domain: ${{ github.event.inputs.custom_domain }}
        TF_VAR_internal_automation_token: ${{ secrets.INTERNAL_AUTOMATION_TOKEN }}
      run: terraform apply tfplan
    - name: Read Terraform outputs
      id: tf
      working-directory: ./terraform
      run: 'echo "api_url=$(terraform output -raw api_endpoint | sed ''s|/$||'')"
        >> $GITHUB_OUTPUT

        echo "s3_bucket=$(terraform output -raw s3_bucket_name)"      >> $GITHUB_OUTPUT

        echo "cf_domain=$(terraform output -raw cloudfront_domain)"   >> $GITHUB_OUTPUT

        echo "cf_id=$(terraform output -raw cloudfront_id)"           >> $GITHUB_OUTPUT

        echo "frontend_url=$(terraform output -raw frontend_url)"     >> $GITHUB_OUTPUT

        echo "ws_url=$(terraform output -raw websocket_endpoint)"     >> $GITHUB_OUTPUT

        echo "name_servers=$(terraform output -json name_servers 2>/dev/null || echo
        ''[]'')" >> $GITHUB_OUTPUT

        '
    - name: Compute effective API URL
      run: "DOMAIN=\"${{ github.event.inputs.custom_domain }}\"\nCF=\"${{ github.event.inputs.enable_cloudfront\
        \ }}\"\nif [ -n \"$DOMAIN\" ] && [ \"$CF\" = \"true\" ]; then\n  echo \"EFFECTIVE_API_URL=https://${DOMAIN}\"\
        \ >> $GITHUB_ENV\nelif [ \"$CF\" = \"true\" ]; then\n  echo \"EFFECTIVE_API_URL=https://${{\
        \ steps.tf.outputs.cf_domain }}\" >> $GITHUB_ENV\nelse\n  echo \"EFFECTIVE_API_URL=${{\
        \ steps.tf.outputs.api_url }}\" >> $GITHUB_ENV\nfi\n"
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
    - name: Build frontend (Next.js static export)
      working-directory: ./frontend
      env:
        NEXT_PUBLIC_API_URL: ${{ env.EFFECTIVE_API_URL }}
        NEXT_PUBLIC_APP_URL: ${{ steps.tf.outputs.frontend_url }}
        NEXT_PUBLIC_VOICE_WS_URL: ${{ steps.tf.outputs.ws_url }}
        NEXT_OUTPUT: export
      run: npm run build
    - name: Sync frontend to S3
      run: "set -euo pipefail\nBUCKET=\"${{ steps.tf.outputs.s3_bucket }}\"\n\n# Pass\
        \ 1: immutable assets (JS, CSS, fonts, images) \u2014 long-lived cache\naws\
        \ s3 sync frontend/out/ \"s3://${BUCKET}/\" \\\n  --delete \\\n  --cache-control\
        \ \"public, max-age=31536000, immutable\" \\\n  --exclude \"*.html\" \\\n\
        \  --region \"${{ env.AWS_REGION }}\"\n\n# Pass 2: HTML files only \u2014\
        \ always revalidate\n# --exclude \"*\" MUST come before --include \"*.html\"\
        \ to scope the filter\naws s3 sync frontend/out/ \"s3://${BUCKET}/\" \\\n\
        \  --cache-control \"no-cache, no-store, must-revalidate\" \\\n  --exclude\
        \ \"*\" \\\n  --include \"*.html\" \\\n  --region \"${{ env.AWS_REGION }}\"\
        \n\n# Pass 3: Extension-less copies for clean URL routing.\n# Next.js App\
        \ Router static export generates flat `login.html` files.\n# S3 website hosting\
        \ only serves /login.html for the exact key \"login.html\",\n# NOT for the\
        \ URL \"/login\". Copy each route HTML as an extension-less key\n# so S3 serves\
        \ /login, /dashboard, etc. directly without CloudFront.\n# index.html and\
        \ 404.html are excluded (served by S3 website config already).\nwhile IFS=\
        \ read -r key; do\n  route=\"${key%.html}\"\n  aws s3 cp \"s3://${BUCKET}/${key}\"\
        \ \"s3://${BUCKET}/${route}\" \\\n    --content-type \"text/html; charset=utf-8\"\
        \ \\\n    --cache-control \"no-cache, no-store, must-revalidate\" \\\n   \
        \ --metadata-directive REPLACE \\\n    --region \"${{ env.AWS_REGION }}\"\n\
        done < <(aws s3 ls \"s3://${BUCKET}/\" --recursive --region \"${{ env.AWS_REGION\
        \ }}\" \\\n  | awk '/\\.html$/ {print $4}' \\\n  | grep -v -E '^(index|404|_not-found)\\\
        .html$')\n"
    - name: Invalidate CloudFront
      if: ${{ steps.tf.outputs.cf_id != '' }}
      run: "aws cloudfront create-invalidation \\\n  --distribution-id \"${{ steps.tf.outputs.cf_id\
        \ }}\" \\\n  --paths \"/*\"\n"
    - name: API smoke test
      run: "set -euo pipefail\nAPI=\"${{ steps.tf.outputs.api_url }}\"\necho \"Waiting\
        \ 60s for Lambda cold-start + DB initialisation ...\"\nsleep 60\necho \"Polling\
        \ ${API}/api/health ...\"\nfor i in $(seq 1 18); do\n  HTTP=$(curl -s -o /dev/null\
        \ -w \"%{http_code}\" \\\n    --connect-timeout 15 --max-time 45 \\\n    \"\
        ${API}/api/health\" || echo \"000\")\n  echo \"  Attempt $i/18 \u2014 HTTP\
        \ ${HTTP}\"\n  if [ \"$HTTP\" = \"200\" ]; then\n    echo \"  API is live\"\
        \n    break\n  fi\n  if [ \"$i\" = \"18\" ]; then\n    echo \"ERROR: API did\
        \ not return 200 after 18 attempts (~6 min total)\"\n    echo \"Check CloudWatch\
        \ Logs: /aws/lambda/${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-api\"\n\
        \    exit 1\n  fi\n  sleep 20\ndone\n"
    - name: Deployment summary
      if: always()
      run: "echo \"## Deployment Complete\" >> $GITHUB_STEP_SUMMARY\necho \"\" >>\
        \ $GITHUB_STEP_SUMMARY\necho \"| Resource | Value |\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"|----------|-------|\" >> $GITHUB_STEP_SUMMARY\necho \"| Frontend \
        \  | ${{ steps.tf.outputs.frontend_url }} |\" >> $GITHUB_STEP_SUMMARY\necho\
        \ \"| API        | ${{ steps.tf.outputs.api_url }} |\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"| WebSocket  | ${{ steps.tf.outputs.ws_url }} |\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"| S3 Bucket  | ${{ steps.tf.outputs.s3_bucket }} |\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"| Image      | ${{ env.IMAGE_URI }} |\" >> $GITHUB_STEP_SUMMARY\n\n\
        # Custom domain + nameserver instructions\nDOMAIN=\"${{ github.event.inputs.custom_domain\
        \ }}\"\nNS='${{ steps.tf.outputs.name_servers }}'\nif [ -n \"$DOMAIN\" ] &&\
        \ [ \"$NS\" != \"[]\" ] && [ -n \"$NS\" ]; then\n  echo \"\" >> $GITHUB_STEP_SUMMARY\n\
        \  echo \"### Custom Domain: ${DOMAIN}\" >> $GITHUB_STEP_SUMMARY\n  echo \"\
        \" >> $GITHUB_STEP_SUMMARY\n  echo \"Update your registrar's nameservers to:\"\
        \ >> $GITHUB_STEP_SUMMARY\n  echo '```' >> $GITHUB_STEP_SUMMARY\n  echo \"\
        ${NS}\" | tr -d '[]\"' | tr ',' '\\n' | sed 's/^ *//' | grep -v '^$' >> $GITHUB_STEP_SUMMARY\n\
        \  echo '```' >> $GITHUB_STEP_SUMMARY\n  echo \"> DNS propagation takes 5\u2013\
        60 minutes after updating the registrar.\" >> $GITHUB_STEP_SUMMARY\nfi\n\n\
        echo \"\" >> $GITHUB_STEP_SUMMARY\necho \"**Cost notes:**\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"- Aurora Serverless v2: ~\\$43/mo (0.5 ACU min)\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"- NAT Gateway: ~\\$32/mo \u2014 destroy with:\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"  \\`terraform destroy -target='module.vpc.aws_nat_gateway.main' -target='module.vpc.aws_eip.nat'\\\
        `\" >> $GITHUB_STEP_SUMMARY\n"
