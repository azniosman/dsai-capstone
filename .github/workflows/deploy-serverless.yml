name: Deploy Serverless Stack

# Manual dispatch only — prevents CI failures on every push when AWS
# credentials haven't been provisioned yet.
# Run from: GitHub → Actions → Deploy Serverless Stack → Run workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]
      skip_terraform:
        description: "Skip Terraform apply (image + frontend only)"
        required: false
        default: false
        type: boolean
      enable_cloudfront:
        description: "Enable CloudFront (requires AWS account verification)"
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: skillbridge
  TF_VERSION: "1.9.0"
  NODE_VERSION: "20"

jobs:
  deploy:
    name: Build & Deploy (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── AWS Auth ─────────────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── Terraform state bucket (idempotent) ──────────────────────────────────
      # S3 backend keeps state across CI runs so resources aren't re-created.
      - name: Ensure Terraform state bucket exists
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="skillbridge-tfstate-${ACCOUNT}-${{ env.ENVIRONMENT }}"
          echo "STATE_BUCKET=${STATE_BUCKET}" >> $GITHUB_ENV

          # Create bucket (us-east-1 does NOT use --create-bucket-configuration)
          aws s3api create-bucket \
            --bucket "$STATE_BUCKET" \
            --region "${{ env.AWS_REGION }}" 2>/dev/null || true

          # Enable versioning so state file history is preserved
          aws s3api put-bucket-versioning \
            --bucket "$STATE_BUCKET" \
            --versioning-configuration Status=Enabled 2>/dev/null || true

          # Block public access on state bucket
          aws s3api put-public-access-block \
            --bucket "$STATE_BUCKET" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true 2>/dev/null || true

          echo "State bucket: $STATE_BUCKET"

      # ── Terraform — Init ──────────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        working-directory: ./terraform
        run: |
          terraform init \
            -upgrade \
            -input=false \
            -backend-config="bucket=${{ env.STATE_BUCKET }}" \
            -backend-config="key=${{ env.ENVIRONMENT }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      # Skip-terraform path still needs init for output reads
      - name: Terraform Init (skip_terraform path)
        if: ${{ github.event.inputs.skip_terraform == 'true' }}
        working-directory: ./terraform
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="skillbridge-tfstate-${ACCOUNT}-${{ env.ENVIRONMENT }}"
          echo "STATE_BUCKET=${STATE_BUCKET}" >> $GITHUB_ENV
          terraform init \
            -upgrade \
            -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${{ env.ENVIRONMENT }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      # ── Step 1: Import existing ECR + targeted apply ──────────────────────────
      - name: Import ECR into Terraform state
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        working-directory: ./terraform
        env:
          TF_VAR_aws_region:        ${{ env.AWS_REGION }}
          TF_VAR_environment:       ${{ env.ENVIRONMENT }}
          TF_VAR_db_password:       ${{ secrets.DB_PASSWORD }}
          TF_VAR_secret_key:        ${{ secrets.SECRET_KEY }}
          TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
        run: |
          terraform import -input=false \
            module.ecr.aws_ecr_repository.backend \
            "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-backend" \
            2>&1 | grep -v "^$" || true

          terraform import -input=false \
            module.ecr.aws_ecr_lifecycle_policy.backend \
            "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-backend" \
            2>&1 | grep -v "^$" || true

      - name: Create ECR repository
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        working-directory: ./terraform
        env:
          TF_VAR_aws_region:        ${{ env.AWS_REGION }}
          TF_VAR_environment:       ${{ env.ENVIRONMENT }}
          TF_VAR_db_password:       ${{ secrets.DB_PASSWORD }}
          TF_VAR_secret_key:        ${{ secrets.SECRET_KEY }}
          TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
        run: terraform apply -target=module.ecr -auto-approve -input=false

      # ── Step 2: Build and push Lambda container image ───────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Lambda image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ECR="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${PROJECT_NAME}-${ENVIRONMENT}-backend"

          docker build \
            --platform linux/amd64 \
            -f backend/Dockerfile.lambda \
            -t "${ECR}:${IMAGE_TAG}" \
            -t "${ECR}:latest" \
            .

          docker push "${ECR}:${IMAGE_TAG}"
          docker push "${ECR}:latest"

          echo "IMAGE_URI=${ECR}:${IMAGE_TAG}" >> $GITHUB_ENV

      # ── Step 3: Pre-apply cleanup of partially-created resources ─────────────
      # Resources created by previous failed Terraform runs that cannot be
      # imported cleanly are deleted here so Terraform recreates them cleanly.
      - name: Clean up partially-created AWS resources
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        working-directory: ./terraform
        env:
          TF_VAR_aws_region:        ${{ env.AWS_REGION }}
          TF_VAR_environment:       ${{ env.ENVIRONMENT }}
          TF_VAR_db_password:       ${{ secrets.DB_PASSWORD }}
          TF_VAR_secret_key:        ${{ secrets.SECRET_KEY }}
          TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          P="${{ env.PROJECT_NAME }}"
          E="${{ env.ENVIRONMENT }}"

          # ── IAM: delete execution role (with attached policies) + custom policy ──
          ROLE_NAME="${P}-${E}-lambda-exec"
          POLICY_ARNS=$(aws iam list-attached-role-policies \
            --role-name "$ROLE_NAME" \
            --query 'AttachedPolicies[].PolicyArn' \
            --output text 2>/dev/null || echo "")
          for ARN in $POLICY_ARNS; do
            aws iam detach-role-policy --role-name "$ROLE_NAME" --policy-arn "$ARN" 2>/dev/null || true
          done
          aws iam delete-role --role-name "$ROLE_NAME" 2>/dev/null || true
          # Also delete the custom policy so Terraform can recreate it
          aws iam delete-policy \
            --policy-arn "arn:aws:iam::${ACCOUNT}:policy/${P}-${E}-lambda-policy" 2>/dev/null || true

          # ── CloudWatch log group (API Gateway) ────────────────────────────────
          aws logs delete-log-group \
            --log-group-name "/aws/apigateway/${P}-${E}" 2>/dev/null || true

          # ── RDS: remove old postgres16 parameter group (no longer in config) ──
          aws rds delete-db-parameter-group \
            --db-parameter-group-name "${P}-${E}-pg16" 2>/dev/null || true

          # ── RDS subnet group: fix VPC mismatch ────────────────────────────────
          # If the subnet group is in a DIFFERENT VPC than the one Terraform
          # currently manages, remove it from state and delete from AWS so
          # Terraform recreates it in the correct VPC.
          TF_VPC_ID=$(terraform state show module.vpc.aws_vpc.main 2>/dev/null \
            | grep -E '^\s+id\s+=' | awk '{print $3}' | tr -d '"' || echo "")
          SG_VPC_ID=$(aws rds describe-db-subnet-groups \
            --db-subnet-group-name "${P}-${E}-db-subnet" \
            --query 'DBSubnetGroups[0].VpcId' --output text 2>/dev/null || echo "")
          if [ -n "$TF_VPC_ID" ] && [ -n "$SG_VPC_ID" ] && \
             [ "$SG_VPC_ID" != "None" ] && [ "$TF_VPC_ID" != "$SG_VPC_ID" ]; then
            echo "VPC mismatch: subnet group is in $SG_VPC_ID, TF manages $TF_VPC_ID — fixing"
            terraform state rm module.rds.aws_db_subnet_group.main 2>/dev/null || true
            aws rds delete-db-subnet-group \
              --db-subnet-group-name "${P}-${E}-db-subnet" 2>/dev/null || true
          fi

          # ── Orphaned VPCs: delete any project VPCs not in current TF state ───
          for VPC_ID in $(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${P}-${E}-vpc" \
            --query 'Vpcs[].VpcId' --output text 2>/dev/null | tr '\t' '\n'); do
            [ -z "$VPC_ID" ] && continue
            [ "$VPC_ID" = "$TF_VPC_ID" ] && { echo "Active VPC $VPC_ID — skip"; continue; }
            echo "Deleting orphaned VPC: $VPC_ID"
            # NAT Gateways (async — must wait before deleting VPC)
            for NAT in $(aws ec2 describe-nat-gateways \
              --filter "Name=vpc-id,Values=$VPC_ID" "Name=state,Values=available" \
              --query 'NatGateways[].NatGatewayId' --output text 2>/dev/null); do
              aws ec2 delete-nat-gateway --nat-gateway-id "$NAT" 2>/dev/null || true
            done
            for i in $(seq 1 18); do
              PENDING=$(aws ec2 describe-nat-gateways \
                --filter "Name=vpc-id,Values=$VPC_ID" "Name=state,Values=available,pending,deleting" \
                --query 'NatGateways[].NatGatewayId' --output text 2>/dev/null)
              [ -z "$PENDING" ] && break; sleep 10
            done
            # Internet Gateway
            for IGW in $(aws ec2 describe-internet-gateways \
              --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
              --query 'InternetGateways[].InternetGatewayId' --output text 2>/dev/null); do
              aws ec2 detach-internet-gateway --internet-gateway-id "$IGW" --vpc-id "$VPC_ID" 2>/dev/null || true
              aws ec2 delete-internet-gateway --internet-gateway-id "$IGW" 2>/dev/null || true
            done
            # Subnets
            for SUBNET in $(aws ec2 describe-subnets \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'Subnets[].SubnetId' --output text 2>/dev/null); do
              aws ec2 delete-subnet --subnet-id "$SUBNET" 2>/dev/null || true
            done
            # Route tables (non-main)
            for RT in $(aws ec2 describe-route-tables \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'RouteTables[?Associations[0].Main != `true`].RouteTableId' \
              --output text 2>/dev/null); do
              aws ec2 delete-route-table --route-table-id "$RT" 2>/dev/null || true
            done
            # Security groups (non-default)
            for SG in $(aws ec2 describe-security-groups \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'SecurityGroups[?GroupName != `default`].GroupId' \
              --output text 2>/dev/null); do
              aws ec2 delete-security-group --group-id "$SG" 2>/dev/null || true
            done
            aws ec2 delete-vpc --vpc-id "$VPC_ID" 2>/dev/null || true
            echo "Deleted orphaned VPC: $VPC_ID"
          done

          # ── Orphaned EIPs (unassociated NAT EIPs) ────────────────────────────
          for EIP in $(aws ec2 describe-addresses \
            --filters "Name=tag:Name,Values=${P}-${E}-nat-eip" \
            --query 'Addresses[?AssociationId==null].AllocationId' \
            --output text 2>/dev/null | tr '\t' '\n'); do
            [ -n "$EIP" ] && aws ec2 release-address --allocation-id "$EIP" 2>/dev/null || true
          done

          echo "Cleanup complete"

      # ── Step 4: Import existing VPC + networking into Terraform state ─────────
      # Resources created by previous partial Terraform runs are imported so
      # the next apply sees them as already managed (no duplicate-create errors).
      - name: Import existing AWS resources into Terraform state
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        working-directory: ./terraform
        env:
          TF_VAR_aws_region:        ${{ env.AWS_REGION }}
          TF_VAR_environment:       ${{ env.ENVIRONMENT }}
          TF_VAR_db_password:       ${{ secrets.DB_PASSWORD }}
          TF_VAR_secret_key:        ${{ secrets.SECRET_KEY }}
          TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
        run: |
          P="${{ env.PROJECT_NAME }}"
          E="${{ env.ENVIRONMENT }}"

          # Helper: run terraform import and swallow "already managed" / "not found" errors
          tf_import() {
            terraform import -input=false "$@" 2>&1 | grep -v "^$" || true
          }

          # ── VPC ──────────────────────────────────────────────────────────────
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${P}-${E}-vpc" \
            --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo "")
          [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ] && \
            tf_import module.vpc.aws_vpc.main "$VPC_ID"

          # ── Subnets ───────────────────────────────────────────────────────────
          for IDX in 0 1; do
            NUM=$((IDX + 1))
            SUB=$(aws ec2 describe-subnets \
              --filters "Name=tag:Name,Values=${P}-${E}-public-${NUM}" \
                        "Name=vpc-id,Values=${VPC_ID}" \
              --query 'Subnets[0].SubnetId' --output text 2>/dev/null || echo "")
            [ -n "$SUB" ] && [ "$SUB" != "None" ] && \
              tf_import "module.vpc.aws_subnet.public[${IDX}]" "$SUB"
          done
          for IDX in 0 1; do
            NUM=$((IDX + 1))
            SUB=$(aws ec2 describe-subnets \
              --filters "Name=tag:Name,Values=${P}-${E}-private-${NUM}" \
                        "Name=vpc-id,Values=${VPC_ID}" \
              --query 'Subnets[0].SubnetId' --output text 2>/dev/null || echo "")
            [ -n "$SUB" ] && [ "$SUB" != "None" ] && \
              tf_import "module.vpc.aws_subnet.private[${IDX}]" "$SUB"
          done

          # ── Internet Gateway ──────────────────────────────────────────────────
          IGW=$(aws ec2 describe-internet-gateways \
            --filters "Name=tag:Name,Values=${P}-${E}-igw" \
            --query 'InternetGateways[0].InternetGatewayId' \
            --output text 2>/dev/null || echo "")
          [ -n "$IGW" ] && [ "$IGW" != "None" ] && \
            tf_import module.vpc.aws_internet_gateway.main "$IGW"

          # ── Elastic IP + NAT Gateway ──────────────────────────────────────────
          EIP=$(aws ec2 describe-addresses \
            --filters "Name=tag:Name,Values=${P}-${E}-nat-eip" \
            --query 'Addresses[0].AllocationId' \
            --output text 2>/dev/null || echo "")
          [ -n "$EIP" ] && [ "$EIP" != "None" ] && \
            tf_import module.vpc.aws_eip.nat "$EIP"

          NAT=$(aws ec2 describe-nat-gateways \
            --filter "Name=tag:Name,Values=${P}-${E}-nat" \
                     "Name=state,Values=available" \
            --query 'NatGateways[0].NatGatewayId' \
            --output text 2>/dev/null || echo "")
          [ -n "$NAT" ] && [ "$NAT" != "None" ] && \
            tf_import module.vpc.aws_nat_gateway.main "$NAT"

          # ── Route Tables + Associations ───────────────────────────────────────
          PUB_RT=$(aws ec2 describe-route-tables \
            --filters "Name=tag:Name,Values=${P}-${E}-public-rt" \
                      "Name=vpc-id,Values=${VPC_ID}" \
            --query 'RouteTables[0].RouteTableId' \
            --output text 2>/dev/null || echo "")
          PRI_RT=$(aws ec2 describe-route-tables \
            --filters "Name=tag:Name,Values=${P}-${E}-private-rt" \
                      "Name=vpc-id,Values=${VPC_ID}" \
            --query 'RouteTables[0].RouteTableId' \
            --output text 2>/dev/null || echo "")
          [ -n "$PUB_RT" ] && [ "$PUB_RT" != "None" ] && \
            tf_import module.vpc.aws_route_table.public "$PUB_RT"
          [ -n "$PRI_RT" ] && [ "$PRI_RT" != "None" ] && \
            tf_import module.vpc.aws_route_table.private "$PRI_RT"

          for IDX in 0 1; do
            NUM=$((IDX + 1))
            SUB=$(aws ec2 describe-subnets \
              --filters "Name=tag:Name,Values=${P}-${E}-public-${NUM}" \
                        "Name=vpc-id,Values=${VPC_ID}" \
              --query 'Subnets[0].SubnetId' --output text 2>/dev/null || echo "")
            [ -n "$SUB" ] && [ "$SUB" != "None" ] && \
            [ -n "$PUB_RT" ] && [ "$PUB_RT" != "None" ] && \
              tf_import "module.vpc.aws_route_table_association.public[${IDX}]" \
                        "${SUB}/${PUB_RT}"
          done
          for IDX in 0 1; do
            NUM=$((IDX + 1))
            SUB=$(aws ec2 describe-subnets \
              --filters "Name=tag:Name,Values=${P}-${E}-private-${NUM}" \
                        "Name=vpc-id,Values=${VPC_ID}" \
              --query 'Subnets[0].SubnetId' --output text 2>/dev/null || echo "")
            [ -n "$SUB" ] && [ "$SUB" != "None" ] && \
            [ -n "$PRI_RT" ] && [ "$PRI_RT" != "None" ] && \
              tf_import "module.vpc.aws_route_table_association.private[${IDX}]" \
                        "${SUB}/${PRI_RT}"
          done

          # ── Security Groups (lambda + alb created in prior partial runs) ──────
          for SG in "lambda:lambda-sg" "alb:alb-sg"; do
            RESOURCE="${SG%%:*}"
            NAME="${SG##*:}"
            SG_ID=$(aws ec2 describe-security-groups \
              --filters "Name=group-name,Values=${P}-${E}-${NAME}" \
                        "Name=vpc-id,Values=${VPC_ID}" \
              --query 'SecurityGroups[0].GroupId' \
              --output text 2>/dev/null || echo "")
            [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ] && \
              tf_import "module.security_groups.aws_security_group.${RESOURCE}" "$SG_ID"
          done

          # ── RDS DB Subnet Group (reusable by Aurora) ──────────────────────────
          tf_import module.rds.aws_db_subnet_group.main "${P}-${E}-db-subnet"

          # ── Secrets Manager secret ────────────────────────────────────────────
          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id "${P}/${E}/db-credentials" \
            --query ARN --output text 2>/dev/null || echo "")
          [ -n "$SECRET_ARN" ] && [ "$SECRET_ARN" != "None" ] && \
            tf_import module.rds.aws_secretsmanager_secret.db_credentials "$SECRET_ARN"

          echo "Import step complete"

      # ── Step 5: Terraform Plan + Apply ────────────────────────────────────────
      - name: Terraform Plan
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        working-directory: ./terraform
        env:
          TF_VAR_aws_region:        ${{ env.AWS_REGION }}
          TF_VAR_environment:       ${{ env.ENVIRONMENT }}
          TF_VAR_db_password:       ${{ secrets.DB_PASSWORD }}
          TF_VAR_secret_key:        ${{ secrets.SECRET_KEY }}
          TF_VAR_gemini_api_key:    ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_lambda_image_uri:  ${{ env.IMAGE_URI }}
          TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
        run: terraform plan -out=tfplan -input=false

      - name: Terraform Apply
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        working-directory: ./terraform
        env:
          TF_VAR_aws_region:        ${{ env.AWS_REGION }}
          TF_VAR_environment:       ${{ env.ENVIRONMENT }}
          TF_VAR_db_password:       ${{ secrets.DB_PASSWORD }}
          TF_VAR_secret_key:        ${{ secrets.SECRET_KEY }}
          TF_VAR_gemini_api_key:    ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_lambda_image_uri:  ${{ env.IMAGE_URI }}
          TF_VAR_enable_cloudfront: ${{ github.event.inputs.enable_cloudfront }}
        run: terraform apply -auto-approve tfplan

      # ── Capture Terraform outputs ─────────────────────────────────────────────
      - name: Read Terraform outputs
        id: tf
        working-directory: ./terraform
        run: |
          echo "api_url=$(terraform output -raw api_endpoint)"        >> $GITHUB_OUTPUT
          echo "s3_bucket=$(terraform output -raw s3_bucket_name)"    >> $GITHUB_OUTPUT
          echo "cf_domain=$(terraform output -raw cloudfront_domain)" >> $GITHUB_OUTPUT
          echo "cf_id=$(terraform output -raw cloudfront_id)"         >> $GITHUB_OUTPUT
          echo "frontend_url=$(terraform output -raw frontend_url)"   >> $GITHUB_OUTPUT

      # ── Step 6: Build and deploy frontend ────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline

      - name: Build frontend (Next.js static export)
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.tf.outputs.api_url }}
          NEXT_PUBLIC_APP_URL: ${{ steps.tf.outputs.frontend_url }}
        run: npm run build

      - name: Sync frontend to S3
        run: |
          # Immutable assets — long-lived cache
          aws s3 sync frontend/out/ "s3://${{ steps.tf.outputs.s3_bucket }}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --region "${{ env.AWS_REGION }}"

          # HTML files — always revalidate
          aws s3 sync frontend/out/ "s3://${{ steps.tf.outputs.s3_bucket }}/" \
            --delete \
            --cache-control "no-cache, no-store, must-revalidate" \
            --include "*.html" \
            --region "${{ env.AWS_REGION }}"

      # ── Step 7: Invalidate CloudFront (skipped when CF is disabled) ──────────
      - name: Invalidate CloudFront
        if: ${{ steps.tf.outputs.cf_id != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.cf_id }}" \
            --paths "/*"

      # ── Summary ───────────────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ steps.tf.outputs.frontend_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API      | ${{ steps.tf.outputs.api_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| S3 Bucket| ${{ steps.tf.outputs.s3_bucket }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image    | ${{ env.IMAGE_URI }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cost notes (capstone-demo.md):**" >> $GITHUB_STEP_SUMMARY
          echo "- Aurora Serverless v2: ~\$43/mo (0.5 ACU min)" >> $GITHUB_STEP_SUMMARY
