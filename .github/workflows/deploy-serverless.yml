        \ | sed 's|/hostedzone/||')\nif [ -n \"$ZONE_ID\" ] && [ \"$ZONE_ID\" != \"\
        None\" ] && [ \"$ZONE_ID\" != \"null\" ]; then\n  echo \"Importing Route 53\
        \ zone: ${ZONE_ID}\"\n  terraform state rm 'module.dns[0].aws_route53_zone.main'\
        \ 2>/dev/null || true\n  terraform import -input=false \\\n    'module.dns[0].aws_route53_zone.main'\
        \ \"${ZONE_ID}\" \\\n    2>&1 | grep -v \"^$\" || true\nelse\n  echo \"No\
        \ existing Route 53 zone for ${DOMAIN} \u2014 Terraform will create it\"\n\
        fi\n\n# Import ACM certificate if one already exists for this domain (us-east-1)\n\
        CERT_ARN=$(aws acm list-certificates \\\n  --region us-east-1 \\\n  --query\
        \ \"CertificateSummaryList[?DomainName=='${DOMAIN}'].CertificateArn | [0]\"\
        \ \\\n  --output text 2>/dev/null)\nif [ -n \"$CERT_ARN\" ] && [ \"$CERT_ARN\"\
        \ != \"None\" ] && [ \"$CERT_ARN\" != \"null\" ]; then\n  echo \"Importing\
        \ ACM certificate: ${CERT_ARN}\"\n  terraform state rm 'module.dns[0].aws_acm_certificate.cert'\
        \ 2>/dev/null || true\n  terraform import -input=false \\\n    'module.dns[0].aws_acm_certificate.cert'\
        \ \"${CERT_ARN}\" \\\n    2>&1 | grep -v \"^$\" || true\nelse\n  echo \"No\
        \ existing ACM certificate for ${DOMAIN} \u2014 Terraform will create it\"\
        \nfi\n\necho \"DNS import complete\"\n"
    - name: Import CloudFront into Terraform state
