        \ CloudFront OAC: ${OAC_ID}\"\n  terraform state rm 'module.cloudfront[0].aws_cloudfront_origin_access_control.web'\
        \ 2>/dev/null || true\n  terraform import -input=false \\\n    'module.cloudfront[0].aws_cloudfront_origin_access_control.web'\
        \ \"${OAC_ID}\" \\\n    2>&1 | grep -v \"^$\" || true\nelse\n  echo \"No existing\
        \ CloudFront OAC \u2014 Terraform will create it\"\nfi\n\n# Import CloudFront\
        \ distribution if it already exists.\n# Search by OAC name first (reliable\
        \ after our own deploys), then fall back\n# to searching by custom_domain\
        \ alias (catches manually-created distributions).\nDIST_ID=$(aws cloudfront\
        \ list-distributions \\\n  --query \"DistributionList.Items[?Comment=='${P}-${E}'].Id\
