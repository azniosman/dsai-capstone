services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-capstone}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-capstone}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./nestjs-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_USER: ${POSTGRES_USER:-capstone}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-capstone}
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_me}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-refresh_token_secret_change_me}
      INTERNAL_AUTOMATION_TOKEN: ${INTERNAL_AUTOMATION_TOKEN:-internal_automation_token_change_me}
      OMP_NUM_THREADS: "1"
      # SSG/WSG API credentials — optional; service falls back to seeded data when absent
      SSG_CLIENT_ID: ${SSG_CLIENT_ID:-}
      SSG_CLIENT_SECRET: ${SSG_CLIENT_SECRET:-}
      SSG_API_BASE_URL: ${SSG_API_BASE_URL:-https://uat-api.ssg-wsg.gov.sg}
      SSG_TOKEN_URL: ${SSG_TOKEN_URL:-}
      SSG_CACHE_TTL_SECONDS: ${SSG_CACHE_TTL_SECONDS:-3600}
      # Live Matrix Dataset Source
      LIVE_MATRIX_SOURCE_URL: ${LIVE_MATRIX_SOURCE_URL:-https://raw.githubusercontent.com/azniosman/dsai-capstone/main/data/seed/skills_intelligence.csv}
    volumes:
      - ./data/seed:/app/data/seed:ro
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=true
      - WEBHOOK_URL=http://${N8N_HOST:-localhost}:5678/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Singapore}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  pgdata:
  n8n_data:
